<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SISTEMA ELITE V11.1 - RECTIFICADO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <style>
        :root { --mostaza: #F58220; }
        body { background-color: #f3f4f6; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        .card { background: white; border: 2px solid #d1d5db; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
        label { font-size: 9px; font-weight: 900; text-transform: uppercase; color: #6b7280; display: block; margin-bottom: 2px; }
        input, select, textarea { border: 2px solid #9ca3af !important; padding: 10px !important; font-size: 14px !important; width: 100%; border-radius: 4px; background: #fff; color: #000; }
        .signature-box { border: 2px solid #000; background: #fff; border-radius: 4px; position: relative; }
        .lock-btn { position: absolute; top: 5px; right: 5px; z-index: 10; background: #eee; padding: 5px; border-radius: 4px; border: 1px solid #ccc; font-size: 12px; }
        .locked { background: #fee2e2 !important; opacity: 0.8; }
        .tag-btn { background: #e5e7eb; border: 1px solid #9ca3af; padding: 6px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body class="pb-24">

<header class="bg-[#1A1A1B] text-white p-4 sticky top-0 z-50 flex justify-between items-center border-b-4 border-[#F58220]">
    <div class="flex items-center gap-3">
        <div id="statusLed" class="h-5 w-5 rounded-full bg-gray-500"></div>
        <h1 class="text-lg font-bold uppercase">Mostaza <span class="text-[#F58220]">Elite V11.1</span></h1>
    </div>
    <button onclick="resetAll()" class="bg-red-700 p-2 rounded text-[10px] font-bold text-white uppercase">Limpiar Todo</button>
</header>

<main class="max-w-2xl mx-auto p-3">
    <form id="mainForm">
        <!-- 1. ADMIN -->
        <div class="card border-l-8 border-l-orange-500">
            <h3 class="text-xs font-black uppercase text-gray-500 mb-3 border-b">1. Datos de la Intervención</h3>
            <div class="grid grid-cols-6 gap-2">
                <div class="col-span-4"><label>Fecha</label><input type="date" id="fecha" class="persist font-bold"></div>
                <div class="col-span-2"><label>Ticket #</label><input type="text" id="ticket" class="persist"></div>
                <div class="col-span-6"><label>Nombre Sucursal</label><input type="text" id="local" list="listaNombres" class="persist uppercase font-bold text-orange-600" oninput="sincronizar('nombre')"><datalist id="listaNombres"></datalist></div>
                <div class="col-span-3"><label>Sigla Sistema</label><input type="text" id="siglaSis" list="listaSiglaSis" class="persist text-center font-bold" oninput="sincronizar('sis')"><datalist id="listaSiglaSis"></datalist></div>
                <div class="col-span-3"><label>Sigla Ticket</label><input type="text" id="siglaTic" list="listaSiglaTic" class="persist text-center font-bold" oninput="sincronizar('tic')"><datalist id="listaSiglaTic"></datalist></div>
                <div class="col-span-6 mt-2">
                    <label>Técnico Responsable</label>
                    <select id="tecnico" class="persist">
                        <option value="Fernando Soria">FERNANDO SORIA</option>
                        <option value="Tomas Vera">TOMAS VERA</option>
                        <option value="Ana Guerrero">ANA GUERRERO</option>
                    </select>
                </div>
                <div class="col-span-6 mt-2">
                    <label>Prioridad / Tipo de Servicio</label>
                    <select id="prioridad" class="persist font-bold text-blue-700">
                        <option value="">-- SELECCIONAR PRIORIDAD --</option>
                        <option value="PROGRAMADO">PROGRAMADO (PREVENTIVO)</option>
                        <option value="URGENTE">URGENTE (CORRECTIVO)</option>
                        <option value="RE-VISITA (FALLA)">RE-VISITA POR FALLA PREVIA</option>
                        <option value="RE-VISITA (REPUESTO)">RE-VISITA POR REPUESTO PENDIENTE</option>
                        <option value="GARANTIA">CARÁCTER DE GARANTÍA</option>
                    </select>
                </div>
                <div class="col-span-6 mt-2"><label>Tiempo de Labor</label><input type="text" id="labor" class="persist" placeholder="00:00 hs"></div>
            </div>
        </div>

        <!-- 2. AGUA -->
        <div class="card border-l-8 border-l-blue-500">
            <h3 class="text-xs font-black uppercase text-blue-600 mb-3 border-b">2. Calidad de Agua</h3>
            <div class="space-y-4">
                <div><label>PPM Post-Filtrado</label><input type="number" id="ppm" class="persist" oninput="evaluarJerarquia()"></div>
                <div class="grid grid-cols-3 gap-2">
                    <div><label>Filtro</label><select id="f_filtrado" class="persist" onchange="evaluarJerarquia()"><option value="OP">OP</option><option value="NO OP">NO OP</option><option value="N/A">N/A</option></select></div>
                    <div><label>Ablandador</label><select id="f_ablandador" class="persist" onchange="evaluarJerarquia()"><option value="OP">OP</option><option value="NO OP">NO OP</option><option value="N/A">N/A</option></select></div>
                    <div><label>Ósmosis</label><select id="f_osmosis" class="persist" onchange="evaluarJerarquia()"><option value="N/A">N/A</option><option value="OP">OP</option><option value="NO OP">NO OP</option></select></div>
                </div>
            </div>
        </div>

        <!-- 3. OBS PREVIAS -->
        <div class="card border-l-8 border-l-purple-500">
            <h3 class="text-xs font-black uppercase text-purple-600 mb-3 border-b">3. Observaciones Iniciales (Arribo)</h3>
            <textarea id="obsPrevias" class="persist text-xs" rows="2" placeholder="Estado del equipo al llegar al local..."></textarea>
        </div>

        <!-- 4. EQUIPOS -->
        <h3 class="text-xs font-black uppercase text-gray-500 mb-3 px-1">4. Relevamiento de Equipos</h3>
        <div id="equiposGrid"></div>
        <button type="button" onclick="addEquipo()" class="w-full mb-6 py-3 border-2 border-dashed border-gray-400 font-bold text-gray-400 uppercase text-xs">+ Añadir Equipo</button>

        <!-- 5. FOTOS -->
        <div class="card border-l-8 border-l-orange-400">
            <h3 class="text-xs font-black uppercase mb-2 text-orange-500 border-b">5. Registro Fotográfico</h3>
            <input type="file" id="fotoInput" accept="image/*" multiple class="text-xs mb-2">
            <div id="fotoPreview" class="grid grid-cols-4 gap-2"></div>
        </div>

        <!-- 6. CIERRE -->
        <div class="card border-l-8 border-l-green-600">
            <h3 class="text-xs font-black uppercase text-green-600 mb-3 border-b">6. Recomendaciones Finales</h3>
            <textarea id="obsFinales" class="persist text-xs" rows="3" placeholder="Sugerencias técnicas para el local..."></textarea>
        </div>

        <!-- 7. FIRMAS -->
        <div class="card">
            <div class="grid grid-cols-1 gap-6">
                <div class="text-center">
                    <label>Firma Técnico</label>
                    <div class="signature-box mx-auto" id="boxT"><button type="button" class="lock-btn" onclick="toggleLock('T')">🔓</button><canvas id="padT" width="350" height="150" class="w-full h-auto"></canvas></div>
                    <button type="button" onclick="clearPad('T')" class="text-[9px] underline uppercase mt-2">Limpiar Firma Téc.</button>
                </div>
                <div class="text-center border-t pt-4">
                    <label>Firma Encargado</label>
                    <div class="signature-box mx-auto" id="boxE"><button type="button" class="lock-btn" onclick="toggleLock('E')">🔓</button><canvas id="padE" width="350" height="150" class="w-full h-auto"></canvas></div>
                    <input type="text" id="nombreEncargado" class="persist text-sm uppercase text-center font-bold mt-2" placeholder="NOMBRE ENCARGADO">
                    <button type="button" onclick="clearPad('E')" class="text-[9px] underline uppercase mt-2">Limpiar Firma Enc.</button>
                </div>
            </div>
        </div>

        <button type="button" onclick="generarPDF()" class="w-full bg-[#F58220] text-white py-4 text-xl font-black uppercase rounded shadow-xl border-b-4 border-orange-800">Generar Informe V11.1</button>
    </form>
</main>

<script>
    const DB_LOCALES = [
        { n: "VILLA DEL PARQUE", s: "FVDP", t: "FVDP" }, { n: "SAN JUSTO", s: "FSJU", t: "FCSJ3" },
        { n: "LAFERRERE 2", s: "FLF2", t: "FLF2" }, { n: "RAMOS", s: "-", t: "FMRAM" },
        { n: "EZEIZA", s: "FEZE", t: "FEZEA" }, { n: "CANNING", s: "FMCAN", t: "FMCAN" },
        { n: "MONTEGRANDE", s: "FMGD", t: "FMGRA" }, { n: "ZARATE", s: "FZAR", t: "FMZAR" },
        { n: "GUALEGUAYCHU", s: "-", t: "FMGUA" }, { n: "CABILDO", s: "FCAB", t: "FCABI" }
    ];

    let padT, padE, processedImages = [], locks = { T: false, E: false }, waterColor = "VERDE", machineColor = "VERDE";
    const TAREAS = ["Limpieza grupo", "Cambio juntas", "Calibración", "Descalcificación"];

    window.onload = () => {
        padT = new SignaturePad(document.getElementById('padT'));
        padE = new SignaturePad(document.getElementById('padE'));
        initDatalists(); loadDraft();
        if(document.querySelectorAll('.equipo-item').length === 0) addEquipo();
        evaluarJerarquia();
        document.querySelectorAll('.persist').forEach(el => el.addEventListener('input', saveDraft));
    };

    function initDatalists() {
        const nL = document.getElementById('listaNombres'), sL = document.getElementById('listaSiglaSis'), tL = document.getElementById('listaSiglaTic');
        DB_LOCALES.forEach(l => { if(l.n!=="-") nL.innerHTML += `<option value="${l.n}">`; if(l.s!=="-") sL.innerHTML += `<option value="${l.s}">`; if(l.t!=="-") tL.innerHTML += `<option value="${l.t}">`; });
    }

    function sincronizar(o) {
        const nI = document.getElementById('local'), sI = document.getElementById('siglaSis'), tI = document.getElementById('siglaTic');
        let enc = null;
        if(o==='nombre') enc = DB_LOCALES.find(l=>l.n===nI.value.toUpperCase());
        if(o==='sis') enc = DB_LOCALES.find(l=>l.s===sI.value.toUpperCase());
        if(o==='tic') enc = DB_LOCALES.find(l=>l.t===tI.value.toUpperCase());
        if(enc) { nI.value = enc.n; sI.value = enc.s; tI.value = enc.t; }
        saveDraft();
    }

    function toggleLock(t) {
        locks[t] = !locks[t]; const pad = t === 'T' ? padT : padE;
        const box = document.getElementById(`box${t}`), btn = box.querySelector('.lock-btn');
        if(locks[t]) { pad.off(); btn.innerText = "🔒"; box.classList.add('locked'); }
        else { pad.on(); btn.innerText = "🔓"; box.classList.remove('locked'); }
    }

    function clearPad(t) { if(locks[t]) return; const pad = t === 'T' ? padT : padE; pad.clear(); }

    function evaluarJerarquia() {
        const ppm = parseInt(document.getElementById('ppm').value) || 0;
        const fallasAgua = [document.getElementById('f_filtrado').value, document.getElementById('f_ablandador').value, document.getElementById('f_osmosis').value].filter(v => v === 'NO OP').length;
        waterColor = (ppm > 200 || fallasAgua >= 2) ? "ROJO" : (ppm > 150 || fallasAgua === 1 ? "AMARILLO" : "VERDE");
        let mS = 0; document.querySelectorAll('.eq-est').forEach(s => { if(s.value==="FUERA DE SERVICIO") mS=2; else if(s.value==="OPERATIVA CON OBS." && mS<2) mS=1; });
        machineColor = mS===2 ? "ROJO" : (mS===1 ? "AMARILLO" : "VERDE");
        document.getElementById('statusLed').className = `h-5 w-5 rounded-full ${waterColor==='ROJO'||machineColor==='ROJO'?'bg-red-600 animate-pulse':'bg-green-500'}`;
        saveDraft();
    }

    function addEquipo(v = null) {
        const div = document.createElement('div'); div.className = "card equipo-item border-l-8 border-l-orange-500";
        div.innerHTML = `
            <div class="flex flex-wrap justify-between items-center mb-3 gap-2">
                <select class="persist-dyn eq-mod font-bold text-orange-600 w-full sm:w-1/2 border-none p-0 bg-transparent">
                    <option value="Cimbali" ${v?.mod==='Cimbali'?'selected':''}>CIMBALI</option><option value="Melitta" ${v?.mod==='Melitta'?'selected':''}>MELITTA</option><option value="Otros" ${v?.mod==='Otros'?'selected':''}>OTROS</option>
                </select>
                <div class="flex gap-2 w-full sm:w-auto">
                    <div class="flex flex-col">
                        <label class="text-[7px]">S/N (Serie)</label>
                        <input type="text" placeholder="S/N" class="persist-dyn eq-sn text-xs text-right border-none" value="${v?.sn||''}">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-[7px]">Ciclos (Shots)</label>
                        <input type="number" placeholder="0" class="persist-dyn eq-shots text-xs text-right border-none font-black text-blue-600" value="${v?.shots||''}">
                    </div>
                    <button type="button" onclick="this.closest('.equipo-item').remove(); evaluarJerarquia();" class="ml-2 text-red-500 font-bold">&times;</button>
                </div>
            </div>
            <textarea placeholder="DIAGNÓSTICO..." class="persist-dyn eq-diag text-xs mb-2" rows="2">${v?.diag||''}</textarea>
            <textarea placeholder="TRABAJOS REALIZADOS..." class="persist-dyn eq-det text-xs mb-2" rows="2">${v?.det||''}</textarea>
            <div class="flex flex-wrap gap-1 mb-2">${TAREAS.map(t=>`<span class="tag-btn text-[9px]" onclick="addTask(this,'${t}')">${t}</span>`).join('')}</div>
            
            <div class="card bg-gray-50 border-none shadow-inner p-2 mt-2">
                <label class="text-blue-800 font-black mb-1">Checklist de Higiene HACCP</label>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[7px]">Lancetas Vapor</label>
                        <select class="persist-dyn h-lanc text-[10px] font-bold" onchange="verificarAlertaHigiene(this)">
                            <option value="OP" ${v?.hL==='OP'?'selected':''}>LIMPIO / OP</option>
                            <option value="SUCIO" ${v?.hL==='SUCIO'?'selected':''}>SUCIO / SIN LIMPIAR</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[7px]">Tolvas de Café</label>
                        <select class="persist-dyn h-tolv text-[10px] font-bold" onchange="verificarAlertaHigiene(this)">
                            <option value="OP" ${v?.hT==='OP'?'selected':''}>LIMPIO / OP</option>
                            <option value="SUCIO" ${v?.hT==='SUCIO'?'selected':''}>SUCIO / CON ACEITE</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[7px]">Circuito Leche</label>
                        <select class="persist-dyn h-leche text-[10px] font-bold" onchange="verificarAlertaHigiene(this)">
                            <option value="OP" ${v?.hLe==='OP'?'selected':''}>LIMPIO / OP</option>
                            <option value="SUCIO" ${v?.hLe==='SUCIO'?'selected':''}>SUCIO / OBSTRUIDO</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[7px]">Limpieza General</label>
                        <select class="persist-dyn h-gral text-[10px] font-bold" onchange="verificarAlertaHigiene(this)">
                            <option value="OP" ${v?.hG==='OP'?'selected':''}>ADECUADA</option>
                            <option value="SUCIO" ${v?.hG==='SUCIO'?'selected':''}>DEFICIENTE</option>
                        </select>
                    </div>
                </div>
                <div class="h-alerta hidden text-red-600 font-black text-[9px] mt-1 animate-pulse">
                    ⚠️ ESTADO CRÍTICO: ADJUNTAR 2 FOTOS DE SUCIEDAD
                </div>
            </div>

            <div class="card bg-blue-50 border-none shadow-inner p-2 mt-2">
                <label class="text-blue-900 font-black mb-1">Insumos de Consumo (Stock local)</label>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="text-[7px]">Pastillas Limpieza</label>
                        <select class="persist-dyn s-past text-[10px] font-bold">
                            <option value="HAY STOCK" ${v?.sP==='HAY STOCK'?'selected':''}>HAY STOCK</option>
                            <option value="CRÍTICO" ${v?.sP==='CRÍTICO'?'selected':''}>FALTANTE / CRÍTICO</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[7px]">Líquido / Descalc.</label>
                        <select class="persist-dyn s-liq text-[10px] font-bold">
                            <option value="HAY STOCK" ${v?.sL==='HAY STOCK'?'selected':''}>HAY STOCK</option>
                            <option value="CRÍTICO" ${v?.sL==='CRÍTICO'?'selected':''}>FALTANTE / CRÍTICO</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[7px]">Sal Ablandador</label>
                        <select class="persist-dyn s-sal text-[10px] font-bold">
                            <option value="HAY STOCK" ${v?.sS==='HAY STOCK'?'selected':''}>HAY STOCK</option>
                            <option value="CRÍTICO" ${v?.sS==='CRÍTICO'?'selected':''}>FALTANTE / CRÍTICO</option>
                            <option value="N/A" ${v?.sS==='N/A'?'selected':''}>N/A</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="space-y-2 border-t pt-2 mt-2">
                <input type="text" placeholder="REPUESTOS UTILIZADOS" class="persist-dyn eq-rep-u text-[10px]" value="${v?.repU||''}">
                <input type="text" placeholder="REPUESTOS RECOMENDADOS (PEDIDO)" class="persist-dyn eq-rep-n text-[10px]" value="${v?.repN||''}">
                <select class="persist-dyn eq-est font-bold text-xs" onchange="evaluarJerarquia()">
                    <option value="OPERATIVA" ${v?.est==='OPERATIVA'?'selected':''}>OPERATIVA</option><option value="OPERATIVA CON OBS." ${v?.est==='OPERATIVA CON OBS.'?'selected':''}>OPERATIVA CON OBS.</option><option value="FUERA DE SERVICIO" ${v?.est==='FUERA DE SERVICIO'?'selected':''}>FUERA DE SERVICIO</option>
                </select>
            </div>`;
        document.getElementById('equiposGrid').appendChild(div);
        div.querySelectorAll('.persist-dyn').forEach(el => el.addEventListener('input', saveDraft));
    }

    function addTask(b, t) { const a = b.closest('.equipo-item').querySelectorAll('textarea')[1]; a.value += (a.value ? ', ' : '') + t; saveDraft(); }

    document.getElementById('fotoInput').onchange = async (e) => {
        const files = Array.from(e.target.files).slice(0, 4); processedImages = [];
        const prev = document.getElementById('fotoPreview'); prev.innerHTML = "<p class='col-span-4 text-[8px] animate-pulse'>Cargando...</p>";
        for (const f of files) {
            const data = await new Promise(res => {
                const r = new FileReader(); r.onload = (ev) => {
                    const img = new Image(); img.onload = () => {
                        const c = document.createElement('canvas'); const s = 800/img.width; c.width = 800; c.height = img.height*s;
                        c.getContext('2d').drawImage(img, 0,0,800,c.height); res(c.toDataURL('image/jpeg', 0.7));
                    }; img.src = ev.target.result;
                }; r.readAsDataURL(f);
            });
            processedImages.push(data);
        }
        prev.innerHTML = ''; processedImages.forEach(img => { const d = document.createElement('div'); d.className = "h-12 border-2 border-orange-500 rounded bg-cover bg-center"; d.style.backgroundImage = `url(${img})`; prev.appendChild(d); });
    };

    function saveDraft() {
        const d = {
            c: { fe: document.getElementById('fecha').value, l: document.getElementById('local').value, ss: document.getElementById('siglaSis').value, st: document.getElementById('siglaTic').value, t: document.getElementById('ticket').value, tec: document.getElementById('tecnico').value, pr: document.getElementById('prioridad').value, p: document.getElementById('ppm').value, f: document.getElementById('f_filtrado').value, a: document.getElementById('f_ablandador').value, o: document.getElementById('f_osmosis').value, lab: document.getElementById('labor').value, op: document.getElementById('obsPrevias').value, of: document.getElementById('obsFinales').value, enc: document.getElementById('nombreEncargado').value },
            e: Array.from(document.querySelectorAll('.equipo-item')).map(eq => ({ 
                mod: eq.querySelector('.eq-mod').value, 
                sn: eq.querySelector('.eq-sn').value, 
                shots: eq.querySelector('.eq-shots').value, 
                diag: eq.querySelector('.eq-diag').value, 
                det: eq.querySelector('.eq-det').value, 
                hL: eq.querySelector('.h-lanc').value,
                hT: eq.querySelector('.h-tolv').value,
                hLe: eq.querySelector('.h-leche').value,
                hG: eq.querySelector('.h-gral').value,
                sP: eq.querySelector('.s-past').value,
                sL: eq.querySelector('.s-liq').value,
                sS: eq.querySelector('.s-sal').value,
                repU: eq.querySelector('.eq-rep-u').value, 
                repN: eq.querySelector('.eq-rep-n').value, 
                est: eq.querySelector('.eq-est').value 
            }))
        };
        localStorage.setItem('mostaza_elite_v11_1', JSON.stringify(d));
    }

    function loadDraft() {
        const r = localStorage.getItem('mostaza_elite_v11_1'); if (!r) return;
        const d = JSON.parse(r); document.getElementById('fecha').value = d.c.fe||''; document.getElementById('local').value = d.c.l||''; document.getElementById('siglaSis').value = d.c.ss||'';
        document.getElementById('siglaTic').value = d.c.st||''; document.getElementById('ticket').value = d.c.t||''; document.getElementById('tecnico').value = d.c.tec||'';
        document.getElementById('ppm').value = d.c.p||''; document.getElementById('prioridad').value = d.c.pr || ''; document.getElementById('labor').value = d.c.lab||''; document.getElementById('obsPrevias').value = d.c.op||''; document.getElementById('obsFinales').value = d.c.of||''; document.getElementById('nombreEncargado').value = d.c.enc||'';
        if (d.e) { document.getElementById('equiposGrid').innerHTML = ''; d.e.forEach(eq => addEquipo(eq)); }
    }

    function getSemCol(s) { return s === "ROJO" ? [200, 0, 0] : (s === "AMARILLO" ? [255, 191, 0] : [0, 150, 0]); }

    function generarPDF() {
        const { jsPDF } = window.jspdf; const doc = new jsPDF();
        let curY = 15;

        // Título y Logo
        doc.setFontSize(18); doc.setTextColor(200); doc.text("M", 100, curY, {align:'center'});
        doc.setFontSize(10); doc.setTextColor(0); doc.setFont("helvetica", "bold"); doc.text("MOSTAZA", 100, curY+5, {align:'center'});
        doc.setFontSize(12); doc.text("INFORME TÉCNICO", 15, curY);
        doc.setFontSize(9); doc.setFont("helvetica", "normal"); doc.text(document.getElementById('fecha').value, 180, curY);
        curY += 15;

        // 1. Datos Intervención
        doc.setDrawColor(200); doc.rect(15, curY, 180, 25);
        doc.setFont("helvetica", "bold"); doc.text("1. Datos de la Intervención", 17, curY+5);
        doc.setFont("helvetica", "normal");
        doc.text(`Local: ${document.getElementById('local').value} (${document.getElementById('siglaTic').value})`, 20, curY+12);
        doc.text(`Técnico: ${document.getElementById('tecnico').value}`, 20, curY+18);
        doc.text(`Ticket N°: ${document.getElementById('ticket').value}`, 110, curY+12);
        doc.setFont("helvetica", "bold");
        doc.text(`PRIORIDAD: ${document.getElementById('prioridad').value}`, 110, curY+18);
        doc.setFont("helvetica", "normal");
        curY += 32;

        // 2. Calidad Agua
        doc.setFillColor(245); doc.rect(15, curY, 180, 12, 'F');
        doc.setFont("helvetica", "bold"); doc.text("2. CALIDAD DE AGUA:", 20, curY+8);
        const cA = getSemCol(waterColor); doc.setFillColor(cA[0],cA[1],cA[2]); doc.circle(65, curY+7, 2.5, 'F');
        doc.setTextColor(cA[0],cA[1],cA[2]); doc.text(waterColor, 70, curY+8);
        doc.setTextColor(0); doc.setFontSize(8); doc.text(`PPM: ${document.getElementById('ppm').value} | FILTRO: ${document.getElementById('f_filtrado').value} | AB: ${document.getElementById('f_ablandador').value} | OSM: ${document.getElementById('f_osmosis').value}`, 110, curY+8);
        curY += 18;

        // 3. Obs Iniciales (Restaurado)
        doc.setFontSize(9); doc.setFont("helvetica", "bold"); doc.text("3. Observaciones Iniciales:", 15, curY);
        doc.setFont("helvetica", "normal"); doc.setFontSize(8);
        const pL = doc.splitTextToSize(document.getElementById('obsPrevias').value || "Sin observaciones al arribo.", 180);
        doc.text(pL, 15, curY+5);
        curY += (pL.length * 4) + 10;

        // 4. Equipos
        document.querySelectorAll('.equipo-item').forEach((eq, i) => {
            if(curY > 240) { doc.addPage(); curY = 20; }
            doc.setFillColor(235); doc.rect(15, curY, 180, 7, 'F');
            doc.setFontSize(9); doc.setFont("helvetica", "bold"); 
            const mod = eq.querySelector('.eq-mod').value;
            const sn = eq.querySelector('.eq-sn').value;
            const shots = eq.querySelector('.eq-shots').value || '0';
            doc.text(`4.${i+1} EQUIPO: ${mod} (SN: ${sn}) | CICLOS: ${shots}`, 17, curY+5);
            curY += 12;
            
            doc.text("Detalle Técnico:", 15, curY); doc.setFont("helvetica", "normal"); doc.text(`Estado Final: ${eq.querySelector('.eq-est').value}`, 110, curY); curY += 5;
            
            doc.setFont("helvetica", "bold"); doc.text("Diagnóstico:", 15, curY); doc.setFont("helvetica", "normal");
            const dL = doc.splitTextToSize(eq.querySelector('.eq-diag').value, 175); doc.text(dL, 15, curY+5); curY += (dL.length * 4) + 8;

            doc.setFont("helvetica", "bold"); doc.text("Trabajos Realizados:", 15, curY); doc.setFont("helvetica", "normal");
            const wL = doc.splitTextToSize(eq.querySelector('.eq-det').value, 175); doc.text(wL, 15, curY+5); curY += (wL.length * 4) + 8;

            doc.setFontSize(8); doc.setFont("helvetica", "bold");
            doc.text("HIGIENE:", 15, curY);
            doc.setFont("helvetica", "normal");
            const hig = `Lancetas: ${eq.querySelector('.h-lanc').value} | Tolvas: ${eq.querySelector('.h-tolv').value} | Leche: ${eq.querySelector('.h-leche').value} | Gral: ${eq.querySelector('.h-gral').value}`;
            doc.text(hig, 35, curY);
            curY += 6;

            doc.setFontSize(8); doc.setFont("helvetica", "bold");
            doc.text("INSUMOS:", 15, curY);
            doc.setFont("helvetica", "normal");
            const insumos = `Pastillas: ${eq.querySelector('.s-past').value} | Líquidos: ${eq.querySelector('.s-liq').value} | Sal: ${eq.querySelector('.s-sal').value}`;
            doc.text(insumos, 35, curY);
            curY += 10;

            doc.setFontSize(8); doc.text(`Repuestos Utilizados: ${eq.querySelector('.eq-rep-u').value || 'Ninguno'}`, 15, curY); curY += 4;
            doc.text(`Solicitud de Repuestos: ${eq.querySelector('.eq-rep-n').value || 'Ninguno'}`, 15, curY); curY += 12;
        });

        // 5. Fotos (Restaurado)
        if(processedImages.length > 0) {
            doc.addPage(); curY = 20;
            doc.setFont("helvetica", "bold"); doc.text("5. Registro Fotográfico", 15, curY); curY += 10;
            processedImages.forEach((img, i) => {
                const x = 15 + (i % 2 * 95); const y = curY + (Math.floor(i / 2) * 75);
                doc.addImage(img, 'JPEG', x, y, 90, 65);
            });
            curY = 200; // Reset para las firmas después de las fotos
        }

        // 6. Recomendaciones Finales (Restaurado)
        if(curY > 240) { doc.addPage(); curY = 20; }
        doc.setFontSize(9); doc.setFont("helvetica", "bold"); doc.text("6. Observaciones y Recomendaciones Finales:", 15, curY);
        doc.setFont("helvetica", "normal"); doc.setFontSize(8);
        const fL = doc.splitTextToSize(document.getElementById('obsFinales').value || "No se registran recomendaciones adicionales.", 180);
        doc.text(fL, 15, curY+5); curY += (fL.length * 4) + 15;

        // 7. Firmas
        if(curY > 230) { doc.addPage(); curY = 20; }
        doc.text("VALIDACIÓN DE CONFORMIDAD", 15, curY);
        doc.addImage(padT.toDataURL(),'PNG', 15, curY+10, 60, 30); doc.addImage(padE.toDataURL(),'PNG', 120, curY+10, 60, 30);
        doc.text("FIRMA TÉCNICO", 15, curY+45); doc.text(`ENCARGADO: ${document.getElementById('nombreEncargado').value}`, 120, curY+45);

        // 8. PÁGINA DE RESUMEN PARA EL ENCARGADO (NUEVA CAPA V11.6)
        doc.addPage();
        let resY = 20;
        
        // Encabezado del Ticket
        doc.setFillColor(245, 130, 32); doc.rect(0, 0, 210, 40, 'F');
        doc.setTextColor(255); doc.setFontSize(16); doc.setFont("helvetica", "bold");
        doc.text("RESUMEN DE SERVICIO PARA GERENCIA", 105, 18, {align:'center'});
        doc.setFontSize(10); doc.setFont("helvetica", "normal");
        doc.text(`LOCAL: ${document.getElementById('local').value} | FECHA: ${document.getElementById('fecha').value}`, 105, 28, {align:'center'});
        
        resY = 55;
        doc.setTextColor(0); doc.setFontSize(12); doc.setFont("helvetica", "bold");
        doc.text("ESTADO GENERAL DE LA INSTALACIÓN:", 15, resY);
        resY += 10;
        
        // Estado del Agua (Simplificado)
        doc.setFontSize(10); doc.text("CALIDAD DE AGUA:", 20, resY);
        const colorA = getSemCol(waterColor); doc.setFillColor(colorA[0], colorA[1], colorA[2]);
        doc.circle(65, resY - 1, 3, 'F');
        doc.setTextColor(colorA[0], colorA[1], colorA[2]); doc.text(waterColor, 70, resY);
        doc.setTextColor(0); doc.setFont("helvetica", "normal");
        doc.text(`(Lectura: ${document.getElementById('ppm').value} PPM)`, 100, resY);
        
        resY += 20;
        doc.setFont("helvetica", "bold"); doc.text("DETALLE DE REPUESTOS Y PEDIDOS:", 15, resY);
        resY += 10;
        
        // Tabla de Repuestos por Equipo
        doc.setDrawColor(200); doc.setFontSize(9);
        document.querySelectorAll('.equipo-item').forEach((eq, i) => {
            doc.setFont("helvetica", "bold");
            doc.text(`${eq.querySelector('.eq-mod').value} (SN: ${eq.querySelector('.eq-sn').value})`, 20, resY);
            resY += 5;
            doc.setFont("helvetica", "normal");
            const pedido = eq.querySelector('.eq-rep-n').value || "SIN PEDIDOS PENDIENTES";
            doc.setTextColor(pedido !== "SIN PEDIDOS PENDIENTES" ? [200, 0, 0] : [0, 0, 0]);
            doc.text(`-> SOLICITUD: ${pedido}`, 25, resY);
            doc.setTextColor(0);
            resY += 10;
        });

        resY += 10;
        doc.setFont("helvetica", "bold"); doc.text("INSUMOS FALTANTES EN LOCAL:", 15, resY);
        resY += 8;
        doc.setFont("helvetica", "normal");
        const insumosCriticos = Array.from(document.querySelectorAll('.persist-dyn'))
            .filter(s => s.value === 'CRÍTICO')
            .map(s => s.previousElementSibling.innerText)
            .join(', ');
        doc.text(insumosCriticos || "STOCK DE INSUMOS COMPLETO", 20, resY);

        // Footer de la segunda página
        doc.setFontSize(8); doc.setTextColor(150);
        doc.text("Este resumen es informativo. El detalle técnico completo consta en la página anterior.", 105, 285, {align:'center'});

        // Finalización
        doc.save(`Reporte_Elite_${document.getElementById('siglaTic').value}_${document.getElementById('fecha').value}.pdf`);
    }

    function resetAll() { if(confirm("¿BORRAR TODO?")) { localStorage.clear(); location.reload(); } }

    function verificarAlertaHigiene(select) {
        const parent = select.closest('.equipo-item');
        const alertas = Array.from(parent.querySelectorAll('select')).filter(s => s.className.includes('h-') && s.value === 'SUCIO');
        const msg = parent.querySelector('.h-alerta');
        
        if(alertas.length > 0) {
            msg.classList.remove('hidden');
            document.getElementById('fotoInput').classList.add('border-red-500', 'bg-red-50');
        } else {
            msg.classList.add('hidden');
            document.getElementById('fotoInput').classList.remove('border-red-500', 'bg-red-50');
        }
        saveDraft();
    }
</script>
</body>
</html>
