<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SISTEMA ELITE V11.0 - PRO DELIVERABLE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <style>
        :root { --mostaza: #F58220; }
        body { background-color: #f3f4f6; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        .card { background: white; border: 2px solid #d1d5db; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
        label { font-size: 9px; font-weight: 900; text-transform: uppercase; color: #6b7280; display: block; margin-bottom: 2px; }
        input, select, textarea { border: 2px solid #9ca3af !important; padding: 10px !important; font-size: 14px !important; width: 100%; border-radius: 4px; background: #fff; color: #000; }
        .signature-box { border: 2px solid #000; background: #fff; border-radius: 4px; position: relative; }
        .lock-btn { position: absolute; top: 5px; right: 5px; z-index: 10; background: #eee; padding: 5px; border-radius: 4px; border: 1px solid #ccc; }
        .locked { background: #fee2e2 !important; opacity: 0.8; }
        .tag-btn { background: #e5e7eb; border: 1px solid #9ca3af; padding: 6px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body class="pb-24">

<header class="bg-[#1A1A1B] text-white p-4 sticky top-0 z-50 flex justify-between items-center border-b-4 border-[#F58220]">
    <div class="flex items-center gap-3">
        <div id="statusLed" class="h-5 w-5 rounded-full bg-gray-500"></div>
        <h1 class="text-lg font-bold uppercase leading-none">Mostaza <span class="text-[#F58220]">Elite V11.0</span></h1>
    </div>
    <button onclick="resetAll()" class="bg-red-700 p-2 rounded text-[10px] font-bold text-white uppercase">Reset Todo</button>
</header>

<main class="max-w-2xl mx-auto p-3">
    <form id="mainForm">
        <div class="card border-l-8 border-l-orange-500">
            <h3 class="text-xs font-black uppercase text-gray-500 mb-3 border-b">1. Datos de la Intervención</h3>
            <div class="grid grid-cols-6 gap-2">
                <div class="col-span-4"><label>Fecha</label><input type="date" id="fecha" class="persist font-bold"></div>
                <div class="col-span-2"><label>Ticket #</label><input type="text" id="ticket" class="persist"></div>
                <div class="col-span-6"><label>Nombre Sucursal</label><input type="text" id="local" list="listaNombres" class="persist uppercase font-bold text-orange-600" oninput="sincronizar('nombre')"><datalist id="listaNombres"></datalist></div>
                <div class="col-span-3"><label>Sigla Sistema</label><input type="text" id="siglaSis" list="listaSiglaSis" class="persist text-center font-bold" oninput="sincronizar('sis')"><datalist id="listaSiglaSis"></datalist></div>
                <div class="col-span-3"><label>Sigla Ticket</label><input type="text" id="siglaTic" list="listaSiglaTic" class="persist text-center font-bold" oninput="sincronizar('tic')"><datalist id="listaSiglaTic"></datalist></div>
                <div class="col-span-6 mt-2"><label>Técnico Responsable</label><select id="tecnico" class="persist"><option value="Fernando Soria">FERNANDO SORIA</option><option value="Tomas Vera">TOMAS VERA</option><option value="Ana Guerrero">ANA GUERRERO</option></select></div>
                <div class="col-span-6 mt-2"><label>Tiempo de Trabajo (Ej: 02:00 hs)</label><input type="text" id="labor" class="persist" placeholder="00:00 hs"></div>
            </div>
        </div>

        <div class="card border-l-8 border-l-blue-500">
            <h3 class="text-xs font-black uppercase text-blue-600 mb-3 border-b">2. Calidad de Agua</h3>
            <div class="space-y-4">
                <div><label>PPM Post-Filtrado</label><input type="number" id="ppm" class="persist" oninput="evaluarJerarquia()"></div>
                <div class="grid grid-cols-3 gap-2">
                    <div><label>Filtro</label><select id="f_filtrado" class="persist" onchange="evaluarJerarquia()"><option value="OP">OP</option><option value="NO OP">NO OP</option><option value="N/A">N/A</option></select></div>
                    <div><label>Ablandador</label><select id="f_ablandador" class="persist" onchange="evaluarJerarquia()"><option value="OP">OP</option><option value="NO OP">NO OP</option><option value="N/A">N/A</option></select></div>
                    <div><label>Ósmosis</label><select id="f_osmosis" class="persist" onchange="evaluarJerarquia()"><option value="N/A">N/A</option><option value="OP">OP</option><option value="NO OP">NO OP</option></select></div>
                </div>
            </div>
        </div>

        <div class="card border-l-8 border-l-purple-500">
            <h3 class="text-xs font-black uppercase text-purple-600 mb-3 border-b">3. Observaciones Iniciales</h3>
            <textarea id="obsPrevias" class="persist text-xs" rows="2" placeholder="Estado del equipo al arribo..."></textarea>
        </div>

        <h3 class="text-xs font-black uppercase text-gray-500 mb-3 px-1">4. Relevamiento de Equipos</h3>
        <div id="equiposGrid"></div>
        <button type="button" onclick="addEquipo()" class="w-full mb-6 py-3 border-2 border-dashed border-gray-400 font-bold text-gray-400 uppercase text-xs">+ Añadir Equipo Intervenido</button>

        <div class="card border-l-8 border-l-orange-400">
            <h3 class="text-xs font-black uppercase mb-2 text-orange-500 border-b">5. Registro Fotográfico</h3>
            <input type="file" id="fotoInput" accept="image/*" multiple class="text-xs mb-2">
            <div id="fotoPreview" class="grid grid-cols-4 gap-2"></div>
        </div>

        <div class="card border-l-8 border-l-green-600">
            <h3 class="text-xs font-black uppercase text-green-600 mb-3 border-b">6. Observaciones y Recomendaciones</h3>
            <textarea id="obsFinales" class="persist text-xs" rows="3" placeholder="Sugerencias técnicas finales..."></textarea>
        </div>

        <div class="card">
            <h3 class="text-xs font-black uppercase text-center mb-4 border-b">7. Validación de Conformidad</h3>
            <div class="grid grid-cols-1 gap-6">
                <div class="text-center">
                    <label>Firma Técnico</label>
                    <div class="signature-box mx-auto" id="boxT"><button type="button" class="lock-btn" onclick="toggleLock('T')">🔓</button><canvas id="padT" width="350" height="150" class="w-full h-auto"></canvas></div>
                    <button type="button" onclick="clearPad('T')" class="text-[9px] underline uppercase mt-2">Limpiar Firma Téc.</button>
                </div>
                <div class="text-center border-t pt-4">
                    <label>Firma Encargado Local</label>
                    <div class="signature-box mx-auto mb-2" id="boxE"><button type="button" class="lock-btn" onclick="toggleLock('E')">🔓</button><canvas id="padE" width="350" height="150" class="w-full h-auto"></canvas></div>
                    <input type="text" id="nombreEncargado" class="persist text-sm uppercase text-center font-bold mt-2" placeholder="NOMBRE DEL ENCARGADO">
                    <button type="button" onclick="clearPad('E')" class="text-[9px] underline uppercase mt-2">Limpiar Firma Enc.</button>
                </div>
            </div>
        </div>

        <button type="button" onclick="generarPDF()" class="w-full bg-[#F58220] text-white py-4 text-xl font-black uppercase rounded shadow-xl border-b-4 border-orange-800 active:translate-y-1">Generar Informe V11.0</button>
    </form>
</main>

<script>
    const DB_LOCALES = [
        { n: "VILLA DEL PARQUE", s: "FVDP", t: "FVDP" }, { n: "SAN JUSTO", s: "FSJU", t: "FCSJ3" },
        { n: "LAFERRERE 2", s: "FLF2", t: "FLF2" }, { n: "RAMOS", s: "-", t: "FMRAM" },
        { n: "EZEIZA", s: "FEZE", t: "FEZEA" }, { n: "CANNING", s: "FMCAN", t: "FMCAN" },
        { n: "MONTEGRANDE", s: "FMGD", t: "FMGRA" }, { n: "ZARATE", s: "FZAR", t: "FMZAR" },
        { n: "GUALEGUAYCHU", s: "-", t: "FMGUA" }, { n: "CABILDO", s: "FCAB", t: "FCABI" }
    ];

    let padT, padE, processedImages = [], locks = { T: false, E: false }, waterColor = "VERDE", machineColor = "VERDE";
    const TAREAS = ["Limpieza grupo", "Cambio juntas", "Calibración", "Descalcificación"];

    window.onload = () => {
        padT = new SignaturePad(document.getElementById('padT'));
        padE = new SignaturePad(document.getElementById('padE'));
        initDatalists(); loadDraft();
        if(document.querySelectorAll('.equipo-item').length === 0) addEquipo();
        evaluarJerarquia();
        document.querySelectorAll('.persist').forEach(el => el.addEventListener('input', saveDraft));
    };

    function initDatalists() {
        const nL = document.getElementById('listaNombres'), sL = document.getElementById('listaSiglaSis'), tL = document.getElementById('listaSiglaTic');
        DB_LOCALES.forEach(l => { if(l.n!=="-") nL.innerHTML += `<option value="${l.n}">`; if(l.s!=="-") sL.innerHTML += `<option value="${l.s}">`; if(l.t!=="-") tL.innerHTML += `<option value="${l.t}">`; });
    }

    function sincronizar(origen) {
        const nI = document.getElementById('local'), sI = document.getElementById('siglaSis'), tI = document.getElementById('siglaTic');
        let enc = null;
        if(origen==='nombre') enc = DB_LOCALES.find(l=>l.n===nI.value.toUpperCase());
        if(origen==='sis') enc = DB_LOCALES.find(l=>l.s===sI.value.toUpperCase());
        if(origen==='tic') enc = DB_LOCALES.find(l=>l.t===tI.value.toUpperCase());
        if(enc) { nI.value = enc.n; sI.value = enc.s; tI.value = enc.t; }
        saveDraft();
    }

    function toggleLock(type) {
        locks[type] = !locks[type]; const pad = type === 'T' ? padT : padE;
        const box = document.getElementById(`box${type}`), btn = box.querySelector('.lock-btn');
        if(locks[type]) { pad.off(); btn.innerText = "🔒"; box.classList.add('locked'); }
        else { pad.on(); btn.innerText = "🔓"; box.classList.remove('locked'); }
    }

    function clearPad(type) { if(locks[type]) return alert("Bloqueado."); const pad = type === 'T' ? padT : padE; pad.clear(); }

    function evaluarJerarquia() {
        const ppm = parseInt(document.getElementById('ppm').value) || 0;
        const fallasAgua = [document.getElementById('f_filtrado').value, document.getElementById('f_ablandador').value, document.getElementById('f_osmosis').value].filter(v => v === 'NO OP').length;
        waterColor = (ppm > 200 || fallasAgua >= 2) ? "ROJO" : (ppm > 150 || fallasAgua === 1 ? "AMARILLO" : "VERDE");
        let mS = 0; document.querySelectorAll('.eq-est').forEach(s => { if(s.value==="FUERA DE SERVICIO") mS=2; else if(s.value==="OPERATIVA CON OBS." && mS<2) mS=1; });
        machineColor = mS===2 ? "ROJO" : (mS===1 ? "AMARILLO" : "VERDE");
        document.getElementById('statusLed').className = `h-5 w-5 rounded-full ${waterColor==='ROJO'||machineColor==='ROJO'?'bg-red-600 animate-pulse':'bg-green-500'}`;
        saveDraft();
    }

    function addEquipo(v = null) {
        const div = document.createElement('div'); div.className = "card equipo-item border-l-8 border-l-orange-500";
        div.innerHTML = `
            <div class="flex justify-between items-center mb-3">
                <select class="persist-dyn eq-mod font-bold text-orange-600 w-2/3 border-none p-0 bg-transparent">
                    <option value="Cimbali" ${v?.mod==='Cimbali'?'selected':''}>CIMBALI</option><option value="Melitta" ${v?.mod==='Melitta'?'selected':''}>MELITTA</option><option value="Otros" ${v?.mod==='Otros'?'selected':''}>OTROS</option>
                </select>
                <input type="text" placeholder="S/N" class="persist-dyn eq-sn text-xs w-1/3 text-right" value="${v?.sn||''}">
                <button type="button" onclick="this.closest('.equipo-item').remove(); evaluarJerarquia();" class="ml-2 text-red-500 font-bold">&times;</button>
            </div>
            <textarea placeholder="DIAGNÓSTICO..." class="persist-dyn eq-diag text-xs mb-2" rows="2">${v?.diag||''}</textarea>
            <textarea placeholder="TRABAJOS REALIZADOS..." class="persist-dyn eq-det text-xs mb-2" rows="2">${v?.det||''}</textarea>
            <div class="flex flex-wrap gap-1 mb-2">${TAREAS.map(t=>`<span class="tag-btn text-[9px]" onclick="addTask(this,'${t}')">${t}</span>`).join('')}</div>
            <div class="space-y-2 border-t pt-2">
                <input type="text" placeholder="REPUESTOS UTILIZADOS" class="persist-dyn eq-rep-u text-[10px]" value="${v?.repU||''}">
                <input type="text" placeholder="REPUESTOS RECOMENDADOS" class="persist-dyn eq-rep-n text-[10px]" value="${v?.repN||''}">
                <select class="persist-dyn eq-est font-bold text-xs" onchange="evaluarJerarquia()">
                    <option value="OPERATIVA" ${v?.est==='OPERATIVA'?'selected':''}>OPERATIVA</option><option value="OPERATIVA CON OBS." ${v?.est==='OPERATIVA CON OBS.'?'selected':''}>OPERATIVA CON OBS.</option><option value="FUERA DE SERVICIO" ${v?.est==='FUERA DE SERVICIO'?'selected':''}>FUERA DE SERVICIO</option>
                </select>
            </div>`;
        document.getElementById('equiposGrid').appendChild(div);
        div.querySelectorAll('.persist-dyn').forEach(el => el.addEventListener('input', saveDraft));
    }

    function addTask(b, t) { const a = b.closest('.equipo-item').querySelectorAll('textarea')[1]; a.value += (a.value ? ', ' : '') + t; saveDraft(); }

    document.getElementById('fotoInput').onchange = async (e) => {
        const files = Array.from(e.target.files).slice(0, 4); processedImages = [];
        const prev = document.getElementById('fotoPreview'); prev.innerHTML = "<p class='col-span-4 text-[8px] animate-pulse uppercase'>Procesando...</p>";
        for (const f of files) {
            const data = await new Promise(res => {
                const r = new FileReader(); r.onload = (ev) => {
                    const img = new Image(); img.onload = () => {
                        const c = document.createElement('canvas'); const s = 800/img.width; c.width = 800; c.height = img.height*s;
                        c.getContext('2d').drawImage(img, 0,0,800,c.height); res(c.toDataURL('image/jpeg', 0.7));
                    }; img.src = ev.target.result;
                }; r.readAsDataURL(f);
            });
            processedImages.push(data);
        }
        prev.innerHTML = ''; processedImages.forEach(img => { const d = document.createElement('div'); d.className = "h-12 border-2 border-orange-500 rounded bg-cover bg-center"; d.style.backgroundImage = `url(${img})`; prev.appendChild(d); });
    };

    function saveDraft() {
        const d = {
            c: { fe: document.getElementById('fecha').value, l: document.getElementById('local').value, ss: document.getElementById('siglaSis').value, st: document.getElementById('siglaTic').value, t: document.getElementById('ticket').value, tec: document.getElementById('tecnico').value, p: document.getElementById('ppm').value, f: document.getElementById('f_filtrado').value, a: document.getElementById('f_ablandador').value, o: document.getElementById('f_osmosis').value, lab: document.getElementById('labor').value, op: document.getElementById('obsPrevias').value, of: document.getElementById('obsFinales').value, enc: document.getElementById('nombreEncargado').value },
            e: Array.from(document.querySelectorAll('.equipo-item')).map(eq => ({ mod: eq.querySelector('.eq-mod').value, sn: eq.querySelector('.eq-sn').value, diag: eq.querySelector('.eq-diag').value, det: eq.querySelector('.eq-det').value, repU: eq.querySelector('.eq-rep-u').value, repN: eq.querySelector('.eq-rep-n').value, est: eq.querySelector('.eq-est').value }))
        };
        localStorage.setItem('mostaza_elite_v11', JSON.stringify(d));
    }

    function loadDraft() {
        const r = localStorage.getItem('mostaza_elite_v11'); if (!r) return;
        const d = JSON.parse(r); document.getElementById('fecha').value = d.c.fe||''; document.getElementById('local').value = d.c.l||''; document.getElementById('siglaSis').value = d.c.ss||'';
        document.getElementById('siglaTic').value = d.c.st||''; document.getElementById('ticket').value = d.c.t||''; document.getElementById('tecnico').value = d.c.tec||''; document.getElementById('ppm').value = d.c.p||'';
        document.getElementById('f_filtrado').value = d.c.f||'OP'; document.getElementById('f_ablandador').value = d.c.a||'OP'; document.getElementById('f_osmosis').value = d.c.o||'N/A';
        document.getElementById('labor').value = d.c.lab||''; document.getElementById('obsPrevias').value = d.c.op||''; document.getElementById('obsFinales').value = d.c.of||''; document.getElementById('nombreEncargado').value = d.c.enc||'';
        if (d.e) { document.getElementById('equiposGrid').innerHTML = ''; d.e.forEach(eq => addEquipo(eq)); }
    }

    function getSemCol(s) { return s === "ROJO" ? [200, 0, 0] : (s === "AMARILLO" ? [255, 191, 0] : [0, 150, 0]); }

    function generarPDF() {
        const { jsPDF } = window.jspdf; const doc = new jsPDF();
        
        // REESTRUCTURACIÓN ESTÉTICA V11
        doc.setFontSize(18); doc.setTextColor(200, 200, 200); doc.text("M", 100, 15, {align:'center'});
        doc.setFontSize(10); doc.setTextColor(0); doc.setFont("helvetica", "bold"); doc.text("MOSTAZA", 100, 20, {align:'center'});
        
        doc.setFontSize(12); doc.text("INFORME TÉCNICO", 15, 15);
        doc.setFontSize(9); doc.setFont("helvetica", "normal"); doc.text(document.getElementById('fecha').value, 180, 15);

        // Bloque Administrativo (Tabla)
        doc.setDrawColor(200); doc.rect(15, 25, 180, 25);
        doc.setFont("helvetica", "bold"); doc.text("1. Datos de la Intervención", 17, 30);
        doc.setFont("helvetica", "normal");
        doc.text(`Local: ${document.getElementById('local').value} (${document.getElementById('siglaTic').value})`, 20, 37);
        doc.text(`Técnico: ${document.getElementById('tecnico').value}`, 20, 42);
        doc.text(`Ticket N°: ${document.getElementById('ticket').value}`, 110, 37);
        doc.text(`Tiempo de Labor: ${document.getElementById('labor').value}`, 110, 42);

        // Badge de Calidad
        doc.setFillColor(245, 245, 245); doc.rect(15, 55, 180, 12, 'F');
        doc.setFont("helvetica", "bold"); doc.text("CALIDAD DE AGUA:", 20, 63);
        const cA = getSemCol(waterColor); doc.setFillColor(cA[0],cA[1],cA[2]); doc.circle(60, 62, 2.5, 'F');
        doc.setTextColor(cA[0],cA[1],cA[2]); doc.text(waterColor, 65, 63);
        doc.setTextColor(0); doc.setFontSize(8); doc.text(`PPM: ${document.getElementById('ppm').value} | FILTRO: ${document.getElementById('f_filtrado').value} | ABLANDADOR: ${document.getElementById('f_ablandador').value}`, 100, 63);

        let y = 75;
        // Equipos con estructura Canning/Cabildo
        document.querySelectorAll('.equipo-item').forEach((eq, i) => {
            if(y > 230) { doc.addPage(); y = 20; }
            doc.setFillColor(230, 230, 230); doc.rect(15, y, 180, 6, 'F');
            doc.setFontSize(9); doc.setFont("helvetica", "bold"); doc.text(`2. EQUIPO: ${eq.querySelector('.eq-mod').value} (S/N: ${eq.querySelector('.eq-sn').value})`, 17, y+4.5);
            y += 12;
            doc.text("Detalle Técnico:", 15, y); doc.setFont("helvetica", "normal");
            doc.text(`Estado Final: ${eq.querySelector('.eq-est').value}`, 110, y);
            y += 5;
            doc.setFont("helvetica", "bold"); doc.text("Diagnóstico:", 15, y); 
            doc.setFont("helvetica", "normal"); 
            const diagLines = doc.splitTextToSize(eq.querySelector('.eq-diag').value, 175);
            doc.text(diagLines, 15, y+5);
            y += (diagLines.length * 4) + 8;
            
            doc.setFont("helvetica", "bold"); doc.text("Trabajos Realizados:", 15, y);
            doc.setFont("helvetica", "normal");
            const workLines = doc.splitTextToSize(eq.querySelector('.eq-det').value, 175);
            doc.text(workLines, 15, y+5);
            y += (workLines.length * 4) + 10;

            doc.setFontSize(8); doc.text(`Repuestos Utilizados: ${eq.querySelector('.eq-rep-u').value || 'Ninguno'}`, 15, y); y += 4;
            doc.text(`Solicitud de Repuestos: ${eq.querySelector('.eq-rep-n').value || 'Ninguno'}`, 15, y); y += 12;
        });

        // Observaciones finales
        if(y > 240) { doc.addPage(); y = 20; }
        doc.setFontSize(9); doc.setFont("helvetica", "bold"); doc.text("4. Observaciones y Recomendaciones", 15, y);
        doc.setFont("helvetica", "normal"); doc.text(doc.splitTextToSize(document.getElementById('obsFinales').value, 180), 15, y+5);

        // Footer inmutable
        const pageCount = doc.internal.getNumberOfPages();
        for(let i = 1; i <= pageCount; i++) {
            doc.setPage(i);
            doc.setFontSize(8); doc.setTextColor(150);
            doc.text("Mantenimiento Franquicias Mostaza", 105, 290, {align:'center'});
        }

        doc.save(`Reporte_Elite_${document.getElementById('siglaTic').value}.pdf`);
    }
    function resetAll() { if(confirm("¿BORRAR TODO?")) { localStorage.clear(); location.reload(); } }
</script>
</body>
</html>
