    <!-- CSS critico anti-FOUC: se aplica en el primer render, antes de Tailwind.
         Pinta el fondo de marca y una barra roja superior al instante, para que
         el arranque ya sea "de la marca". Incluye fallback por timeout para no
         dejar la pagina invisible si algo falla. -->
    <style>
        html { background: #F4F7F6; }
        /* Barra superior de marca visible al instante (identidad de marca en el primer paint). */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; right: 0; height: 64px;
            background: linear-gradient(135deg, #D32F2F 0%, #B71C1C 100%);
            z-index: 1; pointer-events: none;
        }
        /* El contenido arranca semioculto y se revela cuando la app esta lista (clase mtz-listo). */
        body > * { opacity: 0; }
        html.mtz-listo body::before { display: none; }
        html.mtz-listo body > * { opacity: 1; transition: opacity .2s ease-out; }
        @media (prefers-reduced-motion: reduce) { html.mtz-listo body > * { transition: none; } }
    </style>
    <script>
        // Revelado del contenido con fallback por timeout: si algo falla, la pagina no queda invisible.
        (function () {
            function revelar() { document.documentElement.classList.add('mtz-listo'); }
            if (document.readyState === 'complete') { revelar(); }
            else { window.addEventListener('load', revelar); }
            setTimeout(revelar, 2500);
        })();
    </script>

    <style>
        /* Sistema de paleta roja de marca (referencia mostaza-auditoria-tecnica).
           El naranja queda fuera de la app por completo. */
        :root {
            --c-marca: #D32F2F; --c-marca-oscuro: #B71C1C; --c-tinta: #1A1A1B;
            --c-fondo: #F4F7F6; --c-superficie: #ffffff; --c-borde: #e2e5e4;
            --c-borde-input: #9ca3af; --c-label: #6b7280; --c-texto: #333333;
            --c-verde: #16a34a; --c-amarillo: #eab308; --c-rojo: #c80000;
            --radio: 12px; --sombra: 0 2px 8px rgba(0,0,0,.08);
        }
        body { background-color: var(--c-fondo); font-family: sans-serif; -webkit-tap-highlight-color: transparent; color: var(--c-texto); }

        /* Tarjetas: fondo blanco, borde izquierdo rojo de marca, radio 12px, sombra suave y aparicion fadein. */
        .card {
            background: var(--c-superficie); border: 1px solid var(--c-borde);
            border-left: 5px solid var(--c-marca); border-radius: var(--radio);
            padding: 1rem; margin-bottom: 1rem; box-shadow: var(--sombra);
            animation: fadein .18s ease-out;
        }
        @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) { .card { animation: none; } }

        label { font-size: 9px; font-weight: 900; text-transform: uppercase; color: var(--c-label); display: block; margin-bottom: 2px; }

        /* Inputs/selects/textarea: borde gris, radio 12px, foco con outline rojo de marca. */
        input, select, textarea { border: 2px solid var(--c-borde-input) !important; padding: 10px !important; font-size: 14px !important; width: 100%; border-radius: var(--radio); background: #fff; color: #000; }
        input:focus, select:focus, textarea:focus { outline: 3px solid var(--c-marca); outline-offset: 1px; }

        .signature-box { border: 2px solid var(--c-tinta); background: #fff; border-radius: var(--radio); position: relative; }
        .lock-btn { position: absolute; top: 5px; right: 5px; z-index: 10; background: #eee; padding: 5px; border-radius: 8px; border: 1px solid #ccc; font-size: 12px; }
        .locked { background: #fee2e2 !important; opacity: 0.8; }
        .tag-btn { background: #e5e7eb; border: 1px solid var(--c-borde-input); padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; }

        /* Header de marca con gradiente rojo diagonal. */
        .app-header { background: linear-gradient(135deg, #D32F2F 0%, #B71C1C 100%); }

        /* Caja blanca redondeada para el logo oficial, con fallback a la letra "M". */
        .logo-caja { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 10px; background: #fff; box-shadow: var(--sombra); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .logo-img { width: 100%; height: 100%; object-fit: contain; padding: 3px; }
        .logo-caja--fallback { color: var(--c-marca); font-weight: 900; font-size: 22px; }

        /* Semaforo/LED de estado: circular con borde blanco (la logica de color la maneja el JS). */
        #statusLed { border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.08); }

        /* Textos de acento en color de marca. */
        .texto-marca { color: var(--c-marca); }

        /* Botones al lenguaje de la referencia. */
        .btn-principal { background: var(--c-marca); border-bottom: 4px solid var(--c-marca-oscuro); color: #fff; }
        .btn-peligro { background: var(--c-rojo); color: #fff; }

        /* Miniatura de foto con borde de marca. */
        .foto-mini { border: 2px solid var(--c-marca); }
    </style>

<header class="app-header text-white p-4 sticky top-0 z-50 flex justify-between items-center">

                <div class="col-span-3"><label>Sigla Ticket</label><input type="text" id="siglaTic" list="listaSiglaTic" class="persist text-center font-bold" oninput="sincronizar('tic')"><datalist id="listaSiglaTic"></datalist></div>
                <div class="col-span-6 mt-2">
                    <label>Técnico Responsable</label>
                    <select id="tecnico" class="persist">

                        <option value="Tomas Vera">TOMAS VERA</option>
                        <option value="Ana Guerrero">ANA GUERRERO</option>

                </div>
                <div class="grid grid-cols-3 gap-2">

                    <div><label>Ablandador</label><select id="f_ablandador" class="persist" onchange="evaluarJerarquia()"><option value="OP">OP</option><option value="NO OP">NO OP</option><option value="N/A">N/A</option></select></div>
                    <div><label>Ósmosis</label><select id="f_osmosis" class="persist" onchange="evaluarJerarquia()"><option value="N/A">N/A</option><option value="OP">OP</option><option value="NO OP">NO OP</option></select></div>
                </div>
                <div class="mt-3">
                    <label>Detalle de Instalación Hídrica</label>

        </div>

        <div class="card border-l-8 border-l-purple-500">
            <h3 class="text-xs font-black uppercase text-purple-600 mb-3 border-b">3. Observaciones Iniciales (Arribo)</h3>
            <textarea id="obsPrevias" class="persist text-xs" rows="2" placeholder="Estado previo..."></textarea>
        </div>

        <div id="equiposGrid"></div>
        <button type="button" onclick="addEquipo()" class="w-full mb-6 py-3 border-2 border-dashed border-gray-400 font-bold text-gray-400 uppercase text-xs">+ Añadir Equipo</button>

        <div class="card">
            <h3 class="text-xs font-black uppercase mb-2 texto-marca border-b">5. Registro Fotográfico</h3>
            <div class="flex flex-wrap items-center gap-2 mb-2">
                <input type="file" id="fotoInput" accept="image/*" multiple class="text-xs w-auto">
                <span id="fotoHelp" class="text-[10px] text-red-600 font-bold"></span>
            </div>
            <div id="fotoPreview" class="grid grid-cols-4 gap-2"></div>
        </div>

        <div class="card border-l-8 border-l-green-600">
            <h3 class="text-xs font-black uppercase text-green-600 mb-3 border-b">6. Recomendaciones Finales</h3>
            <textarea id="obsFinales" class="persist text-xs" rows="3" placeholder="Sugerencias finales..."></textarea>
        </div>

        <div class="card">
            <div class="grid grid-cols-1 gap-6">
                <div class="text-center">
                    <label>Firma Técnico</label>
                    <div class="signature-box mx-auto" id="boxT"><button type="button" class="lock-btn" onclick="toggleLock('T')">🔓</button><canvas id="padT" width="350" height="150" class="w-full h-auto"></canvas></div>
                    <button type="button" onclick="clearPad('T')" class="text-[9px] underline uppercase mt-2">Limpiar Firma Téc.</button>
                </div>
                <div class="text-center border-t pt-4">
                    <label>Firma Encargado</label>
                    <div class="signature-box mx-auto" id="boxE"><button type="button" class="lock-btn" onclick="toggleLock('E')">🔓</button><canvas id="padE" width="350" height="150" class="w-full h-auto"></canvas></div>
                    <input type="text" id="nombreEncargado" class="persist text-sm uppercase text-center font-bold mt-2" placeholder="NOMBRE ENCARGADO">
                    <button type="button" onclick="clearPad('E')" class="text-[9px] underline uppercase mt-2">Limpiar Firma Enc.</button>
                </div>
            </div>
        </div>

        <button type="button" onclick="generarPDF()" class="btn-principal w-full text-white py-4 text-xl font-black uppercase rounded shadow-xl">Generar Informe V12.8</button>
    </form>
</main>

    let padT, padE, processedImages = [], locks = { T: false, E: false }, waterColor = "VERDE";
    let firmaTData = '', firmaEData = ''; // B6/B11: dataURLs de firmas restauradas, re-aplicadas tras el resize
    let avisoQuotaMostrado = false; // evita repetir la alerta de cuota llena en cada tecla

    // B11: ajustar la resolución interna del canvas al devicePixelRatio y al tamaño renderizado.
    // signature_pad limpia el pad al redimensionar, por eso se preserva y re-restaura el trazo.
    // fallbackDataURL: firma restaurada vía fromDataURL (sin datos de puntos internos); se re-aplica
    // cuando el pad no tiene trazo "vivo" para que una firma restaurada sobreviva a un resize/rotación.
    function resizeCanvas(canvas, pad, fallbackDataURL) {
        if (!canvas || !pad) return;
        const data = (typeof pad.toData === 'function' && !pad.isEmpty()) ? pad.toData() : null;
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        const rect = canvas.getBoundingClientRect();
        const w = rect.width || canvas.clientWidth || canvas.width;
        const h = rect.height || canvas.clientHeight || canvas.height;
        canvas.width = w * ratio;
        canvas.height = h * ratio;
        const ctx = canvas.getContext('2d');
        ctx.scale(ratio, ratio);
        pad.clear(); // reinicia el estado interno tras cambiar el tamaño del canvas
        if (data) {
            // Trazo dibujado en vivo: se preserva con toData/fromData (soporta el nuevo tamaño).
            try { pad.fromData(data); } catch (e) {}
        } else if (fallbackDataURL) {
            // Firma restaurada (sin puntos internos): se re-aplica desde el dataURL guardado.
            try { pad.fromDataURL(fallbackDataURL); } catch (e) {}
        }
    }

    function resizeAllPads() {
        resizeCanvas(document.getElementById('padT'), padT, firmaTData);
        resizeCanvas(document.getElementById('padE'), padE, firmaEData);
    }

    // B10: avisar de forma visible si alguna librería CDN no cargó.
    function avisarCdnFaltante(msg) {
        let banner = document.getElementById('cdnWarnBanner');
        if (!banner) {
            banner = document.createElement('div');
            banner.id = 'cdnWarnBanner';
            banner.style.cssText = 'background:#b91c1c;color:#fff;padding:10px;text-align:center;font-weight:bold;font-size:12px;position:sticky;top:0;z-index:100;';
            document.body.insertBefore(banner, document.body.firstChild);
        }
        banner.innerText = msg;
    }

    window.onload = () => {
        // B10: detectar CDNs faltantes sin frenar el resto del onload.
        const faltaSignature = (typeof SignaturePad === 'undefined');
        const faltaJsPdf = (typeof window.jspdf === 'undefined');
        if (faltaSignature || faltaJsPdf) {
            const libs = [];
            if (faltaSignature) libs.push('firmas (signature_pad)');
            if (faltaJsPdf) libs.push('PDF (jsPDF)');
            avisarCdnFaltante(`⚠️ No se pudieron cargar librerías necesarias: ${libs.join(' y ')}. Verificá tu conexión a internet y recargá la app.`);
        }

        if (!faltaSignature) {
            padT = new SignaturePad(document.getElementById('padT'));
            padE = new SignaturePad(document.getElementById('padE'));
        }
        initDatalists(); loadDraft();
        // B11: redimensionar después de loadDraft (que ya restauró las firmas) para que sobrevivan al primer layout.
        if (!faltaSignature) {
            resizeAllPads();
            restaurarFirmas(); // aplicar firmas restauradas sobre los pads ya dimensionados
            window.addEventListener('resize', resizeAllPads);
            window.addEventListener('orientationchange', resizeAllPads);
        }
        enforzarPisoLabor(document.getElementById('labor'));
        enforzarDefaultTraslado(document.getElementById('traslado'));
        if(document.querySelectorAll('.equipo-item').length === 0) addEquipo();
        evaluarJerarquia();
        document.querySelectorAll('.persist').forEach(el => el.addEventListener('input', saveDraft));
    };

    function initDatalists() {
        const nL = document.getElementById('listaNombres'), sL = document.getElementById('listaSiglaSis'), tL = document.getElementById('listaSiglaTic');
        DB_LOCALES.forEach(l => { if(l.n!=="-") nL.innerHTML += `<option value="${l.n}">`; if(l.s!=="-") sL.innerHTML += `<option value="${l.s}">`; if(l.t!=="-") tL.innerHTML += `<option value="${l.t}">`; });
    }

    function sincronizar(o) {
        const nI = document.getElementById('local'), sI = document.getElementById('siglaSis'), tI = document.getElementById('siglaTic');
        
        const valLocal = nI.value.toUpperCase().trim();
        const valSis = sI.value.toUpperCase().trim();
        const valTic = tI.value.toUpperCase().trim();

        // 1. Intentar buscar coincidencia completa en la base de datos
        let enc = DB_LOCALES.find(l => 
            (o === 'nombre' && l.n.toUpperCase().trim() === valLocal) || 
            (o === 'sis' && l.s.toUpperCase().trim() === valSis) || 
            (o === 'tic' && l.t.toUpperCase().trim() === valTic)
        );

        if (enc) {
            // Coincidencia encontrada: autocompletamos los tres campos
            nI.value = enc.n;
            sI.value = enc.s;
            tI.value = enc.t;
            actualizarCodigoInforme(enc.id);
        } else {
            // Sin coincidencia: prevenimos el arrastre de datos obsoletos
            if (o === 'nombre') {
                // Si cambiamos el nombre y las siglas actuales pertenecen a algún local de la DB,
                // las limpiamos ya que el nombre ya no coincide con ese local.
                const asoc = DB_LOCALES.find(l => l.s.toUpperCase().trim() === valSis || l.t.toUpperCase().trim() === valTic);
                if (asoc) {
                    sI.value = '';
                    tI.value = '';
                }
            } else if (o === 'sis') {
                // Si cambiamos la sigla de sistema y el nombre de local actual pertenece a la DB,
                // lo limpiamos porque ya no coincide con la sigla.
                const asoc = DB_LOCALES.find(l => l.n.toUpperCase().trim() === valLocal);
                if (asoc) {
                    nI.value = '';
                    tI.value = '';
                }
            } else if (o === 'tic') {
                // Si cambiamos la sigla de ticket y el nombre de local actual pertenece a la DB, lo limpiamos.
                const asoc = DB_LOCALES.find(l => l.n.toUpperCase().trim() === valLocal);
                if (asoc) {
                    nI.value = '';
                    sI.value = '';
                }
            }
            const codInput = document.getElementById('codigo_informe');
            if (codInput) codInput.value = '';
        }
        saveDraft();
    }

    function actualizarCodigoInforme(storeId) {
        const codigoInput = document.getElementById('codigo_informe');
        if (!codigoInput) return;
        
        let currentCode = codigoInput.value;
        const storeIdStr = String(storeId).padStart(3, '0');
        
        if (currentCode && currentCode.startsWith('MF-')) {
            const parts = currentCode.split('-');
            if (parts.length === 3) {
                codigoInput.value = `MF-${parts[1]}-${storeIdStr}`;
                saveDraft();
                return;
            }
        }
        
        const epoch = new Date('2026-01-01T00:00:00');
        const now = new Date();
        const diffMs = now - epoch;
        const diffMinutes = Math.floor(diffMs / 60000);
        
        const minutesStr = String(diffMinutes).padStart(6, '0');
        codigoInput.value = `MF-${minutesStr}-${storeIdStr}`;
        saveDraft();
    }

    function toggleLock(t) {
        locks[t] = !locks[t]; const pad = t === 'T' ? padT : padE;
        const box = document.getElementById(`box${t}`), btn = box.querySelector('.lock-btn');
        if(locks[t]) { pad.off(); btn.innerText = "🔒"; box.classList.add('locked'); }
        else { pad.on(); btn.innerText = "🔓"; box.classList.remove('locked'); }
    }

    function clearPad(t) {
        if (locks[t]) return;
        (t === 'T' ? padT : padE).clear();
        // También limpiar el dataURL cacheado para que un resize/rotación no resucite la firma borrada.
        if (t === 'T') firmaTData = ''; else firmaEData = '';
    }

    function evaluarJerarquia() {
        const isPendiente = document.getElementById('ppm_pendiente') ? document.getElementById('ppm_pendiente').checked : false;
        // B9: distinguir campo vacío ('') de un 0 real.
        let ppm = null; // null = sin lectura
        if (!isPendiente) {
            const rawPpm = (document.getElementById('ppm').value || '').trim();
            if (rawPpm !== '') {
                const parsed = parseInt(rawPpm, 10);
                ppm = isNaN(parsed) ? null : parsed;
            }
        }
        const tieneLectura = ppm !== null;
        const fallasAgua = [document.getElementById('f_filtrado').value, document.getElementById('f_ablandador').value, document.getElementById('f_osmosis').value].filter(v => v === 'NO OP').length;
        waterColor = (isPendiente) ? 
            (fallasAgua >= 2 ? "ROJO" : (fallasAgua === 1 ? "AMARILLO" : "VERDE")) :
            (((tieneLectura && (ppm > 300 || (ppm >= 0 && ppm < 50))) || fallasAgua >= 2) ? "ROJO" : ((tieneLectura && ppm >= 120) || fallasAgua === 1 ? "AMARILLO" : "VERDE"));
        let mS = 0; document.querySelectorAll('.eq-est').forEach(s => { if(s.value==="FUERA DE SERVICIO") mS=2; else if(s.value==="OPERATIVA CON OBS." && mS<2) mS=1; });
        document.getElementById('statusLed').className = `h-5 w-5 rounded-full ${waterColor==='ROJO'||mS===2?'bg-red-600 animate-pulse':'bg-green-500'}`;
        saveDraft();
    }

    // B15: escapar valores dinámicos antes de inyectarlos en innerHTML (mitiga XSS almacenado)
    function escapeHtml(val) {
        return String(val == null ? '' : val)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function renderFotoPreview() {
        const prev = document.getElementById('fotoPreview');
        if (!prev) return;
        prev.innerHTML = '';
        processedImages.forEach(img => { const d = document.createElement('div'); d.className = "h-12 foto-mini rounded bg-cover bg-center"; d.style.backgroundImage = `url(${img})`; prev.appendChild(d); });
    }

    document.getElementById('fotoInput').onchange = async (e) => {
        const help = document.getElementById('fotoHelp');
        const files = Array.from(e.target.files);
        const prev = document.getElementById('fotoPreview'); prev.innerHTML = "<p class='col-span-4 text-[8px] animate-pulse'>Procesando...</p>";
        for (const f of files) {
            const data = await new Promise(res => {
                const r = new FileReader(); r.onload = (ev) => {
                    const img = new Image(); img.onload = () => {
                        const c = document.createElement('canvas'); const s = 800/img.width; c.width = 800; c.height = img.height*s;
                        c.getContext('2d').drawImage(img, 0,0,800,c.height); res(c.toDataURL('image/jpeg', 0.7));
                    }; img.src = ev.target.result;
                }; r.readAsDataURL(f);
            });
            processedImages.push(data);
        }
        // B8: acumular sobre las existentes respetando el tope de 8 fotos
        const totalAcumulado = processedImages.length;
        processedImages = processedImages.slice(0, 8);
        if (totalAcumulado > 8) {
            help.innerText = `⚠️ Límite: Se conservan las primeras 8 fotos (se descartaron ${totalAcumulado - 8}).`;
        } else {
            help.innerText = '';
        }
        renderFotoPreview();
        e.target.value = '';
        saveDraft();
    };

    function saveDraft() {
        const d = {
            c: { fe: document.getElementById('fecha').value, l: document.getElementById('local').value, ss: document.getElementById('siglaSis').value, st: document.getElementById('siglaTic').value, t: document.getElementById('ticket').value, tec: document.getElementById('tecnico').value, pr: document.getElementById('prioridad').value, p: document.getElementById('ppm').value, pp: document.getElementById('ppm_pendiente').checked, cod: document.getElementById('codigo_informe').value, oa: document.getElementById('obsAgua').value, f: document.getElementById('f_filtrado').value, a: document.getElementById('f_ablandador').value, o: document.getElementById('f_osmosis').value, lab: document.getElementById('labor').value, via: document.getElementById('traslado').value, op: document.getElementById('obsPrevias').value, of: document.getElementById('obsFinales').value, enc: document.getElementById('nombreEncargado').value },
            e: Array.from(document.querySelectorAll('.equipo-item')).map(eq => ({ mod: eq.querySelector('.eq-mod').value, sn: eq.querySelector('.eq-sn').value, shots: eq.querySelector('.eq-shots').value, diag: eq.querySelector('.eq-diag').value, det: eq.querySelector('.eq-det').value, hL: eq.querySelector('.h-lanc').value, hT: eq.querySelector('.h-tolv').value, hLe: eq.querySelector('.h-leche').value, hG: eq.querySelector('.h-gral').value, sP: eq.querySelector('.s-past').value, sL: eq.querySelector('.s-liq').value, sS: eq.querySelector('.s-sal').value, repN: eq.querySelector('.eq-rep-n').value, gasF: eq.querySelector('.eq-gas-f').value, est: eq.querySelector('.eq-est').value }))
        };
        // B4: persistir fotos procesadas
        d.img = processedImages;
        // B6: persistir firmas (solo si no están vacías)
        d.firmaT = (padT && !padT.isEmpty()) ? padT.toDataURL() : '';
        d.firmaE = (padE && !padE.isEmpty()) ? padE.toDataURL() : '';
        // Guardado defensivo: fotos + firmas pueden acercarse al límite (~5MB) de localStorage.
        // Si setItem falla (QuotaExceededError) avisamos al técnico una sola vez en lugar de fallar en silencio.
        try {
            localStorage.setItem('mostaza_mtz_v12_7', JSON.stringify(d));
            avisoQuotaMostrado = false;
        } catch (err) {
            if (!avisoQuotaMostrado) {
                avisoQuotaMostrado = true;
                alert('⚠️ No se pudo guardar el borrador automáticamente: el almacenamiento del navegador está lleno (probablemente por muchas fotos). Generá el PDF ahora para no perder el trabajo y considerá reducir la cantidad de fotos.');
            }
        }
    }

    function loadDraft() {
        let r = localStorage.getItem('mostaza_mtz_v12_7');
        if (r === null) { const old = localStorage.getItem('mostaza_mtz_v12_5'); if (old !== null) { localStorage.setItem('mostaza_mtz_v12_7', old); r = old; } }
        if (!r) return;
        // B5: parseo defensivo. Si el dato está corrupto o en formato viejo, limpiamos y arrancamos limpio.
        let d;
        try {
            d = JSON.parse(r);
            if (!d || typeof d !== 'object' || !d.c) throw new Error('Formato de borrador inválido');
        } catch (err) {
            localStorage.removeItem('mostaza_mtz_v12_7');
            return;
        }
        document.getElementById('fecha').value = d.c.fe||''; document.getElementById('local').value = d.c.l||''; document.getElementById('siglaSis').value = d.c.ss||'';
        document.getElementById('siglaTic').value = d.c.st||''; document.getElementById('ticket').value = d.c.t||''; document.getElementById('tecnico').value = d.c.tec||'';
        document.getElementById('ppm').value = d.c.p||''; 
        const ppmPendiente = document.getElementById('ppm_pendiente');
        if (ppmPendiente) {
            ppmPendiente.checked = d.c.pp || false;
            document.getElementById('ppm').disabled = ppmPendiente.checked;
        }
        document.getElementById('codigo_informe').value = d.c.cod||'';
        if (d.c.l && !d.c.cod) {
            const enc = DB_LOCALES.find(l => l.n.toUpperCase().trim() === d.c.l.toUpperCase().trim());
            if (enc) {
                actualizarCodigoInforme(enc.id);
            }
        }
        document.getElementById('prioridad').value = d.c.pr || ''; 
        enforzarPisoLabor(document.getElementById('labor'), d.c.lab); 
        enforzarDefaultTraslado(document.getElementById('traslado'), d.c.via); 
        document.getElementById('obsAgua').value = d.c.oa || ''; document.getElementById('obsPrevias').value = d.c.op||''; document.getElementById('obsFinales').value = d.c.of||''; document.getElementById('nombreEncargado').value = d.c.enc||'';
        if (d.e) { document.getElementById('equiposGrid').innerHTML = ''; d.e.forEach(eq => addEquipo(eq)); }
        // B4: restaurar fotos y previews
        if (Array.isArray(d.img)) { processedImages = d.img.slice(0, 8); renderFotoPreview(); }
        // B6: guardar firmas para re-aplicarlas después del resize del canvas (B11 limpia el pad al redimensionar)
        firmaTData = d.firmaT || '';
        firmaEData = d.firmaE || '';
    }

    // B6/B11: aplica las firmas guardadas sobre los pads ya redimensionados
    function restaurarFirmas() {
        if (padT && firmaTData) { try { padT.fromDataURL(firmaTData); } catch (e) {} }
        if (padE && firmaEData) { try { padE.fromDataURL(firmaEData); } catch (e) {} }
    }

            doc.setTextColor(255); doc.setFontSize(12); doc.text("RESUMEN DE ESTADO PARA GERENCIA", 105, 34.5, {align:'center'});
            resY = 50; doc.setTextColor(0); doc.setFont("helvetica", "bold"); doc.text("DATOS DE CONTROL:", 15, resY);
            doc.setFont("helvetica", "normal"); doc.text(`LOCAL: ${document.getElementById('local').value}`, 15, resY + 7);
            doc.text(`TICKET: ${document.getElementById('ticket').value} | FECHA: ${document.getElementById('fecha').value}`, 110, resY + 7);
            resY += 20;
            doc.setFont("helvetica", "bold"); doc.text("ESTADO AGUA:", 15, resY); 
            doc.setFillColor(cA[0], cA[1], cA[2]); doc.circle(45, resY - 1, 3, 'F'); resY += 15;
            doc.text("ACCIONES POR EQUIPO:", 15, resY); resY += 8;
            document.querySelectorAll('.equipo-item').forEach(eq => {
                const s = eq.querySelector('.eq-est').value;
                let c = getSemCol(s.includes("FUERA") ? "ROJO" : (s.includes("OBS") ? "AMARILLO" : "VERDE"));
                doc.setFillColor(c[0], c[1], c[2]); doc.circle(18, resY - 1, 2, 'F');
                doc.setFont("helvetica", "bold");
                const repText = eq.querySelector('.eq-rep-n').value ? `Repuestos: ${eq.querySelector('.eq-rep-n').value}` : 'Sin pedidos';
                const gasText = eq.querySelector('.eq-gas-f').value ? ` | Gastos: $${eq.querySelector('.eq-gas-f').value} ARS` : '';
                doc.text(`${eq.querySelector('.eq-mod').value}: ${repText}${gasText}`, 25, resY);
                resY += 8;
            });

            for(let i = 1; i <= doc.internal.getNumberOfPages(); i++) { doc.setPage(i); doc.setFontSize(7); doc.setTextColor(150); doc.text("Mostaza Mantenimiento Franquicias - Control Interno Regional", 105, 290, {align:'center'}); }

            const fname = document.getElementById('siglaTic').value || 'Rep';
            doc.save(`MTZ_${fname}_${document.getElementById('fecha').value}.pdf`);
        } catch (e) { alert("Error PDF: " + e.message); }
    }

    function bloquearInvalidos(e) {
        if (['e', 'E', '+', '-', '.', ','].includes(e.key)) {
            e.preventDefault();
        }
    }

    function validarLabor(el) {
        if (el && el.value) {
            el.value = el.value.replace(/[^0-9]/g, '');
        }
    }

    function enforzarPisoLabor(el, customVal) {
        if (!el) return;
        let raw = (customVal !== undefined && customVal !== null) ? customVal : el.value;
        let val = parseInt(raw, 10);
        if (isNaN(val) || val < 2) {
            el.value = 2;
        } else {
            el.value = val;
        }
    }

    function validarTraslado(el) {
        if (el && el.value) {
            el.value = el.value.replace(/[^0-9]/g, '');
        }
    }

    function enforzarDefaultTraslado(el, customVal) {
        if (!el) return;
        let raw = (customVal !== undefined && customVal !== null) ? customVal : el.value;
        let val = parseInt(raw, 10);
        if (isNaN(val) || val < 0) {
            el.value = 0;
        } else {
            el.value = val;
        }
    }

    function resetAll() { if(confirm("¿BORRAR?")) { localStorage.clear(); location.reload(); } }
</script>
</body>
