<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOSTAZA MANTENIMIENTO FRANQUICIAS V11.7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <style>
        :root { --mostaza: #F58220; }
        body { background-color: #f3f4f6; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        .card { background: white; border: 2px solid #d1d5db; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
        label { font-size: 9px; font-weight: 900; text-transform: uppercase; color: #6b7280; display: block; margin-bottom: 2px; }
        input, select, textarea { border: 2px solid #9ca3af !important; padding: 10px !important; font-size: 14px !important; width: 100%; border-radius: 4px; background: #fff; color: #000; }
        .signature-box { border: 2px solid #000; background: #fff; border-radius: 4px; position: relative; }
        .lock-btn { position: absolute; top: 5px; right: 5px; z-index: 10; background: #eee; padding: 5px; border-radius: 4px; border: 1px solid #ccc; font-size: 12px; }
        .locked { background: #fee2e2 !important; opacity: 0.8; }
        .tag-btn { background: #e5e7eb; border: 1px solid #9ca3af; padding: 6px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body class="pb-24">

<header class="bg-[#1A1A1B] text-white p-4 sticky top-0 z-50 flex justify-between items-center border-b-4 border-[#F58220]">
    <div class="flex items-center gap-3">
        <div id="statusLed" class="h-5 w-5 rounded-full bg-gray-500"></div>
        <h1 class="text-xs sm:text-lg font-bold uppercase">Mostaza <span class="text-[#F58220]">Mantenimiento Franquicias V11.7</span></h1>
    </div>
    <button onclick="resetAll()" class="bg-red-700 p-2 rounded text-[10px] font-bold text-white uppercase">Limpiar Todo</button>
</header>

<main class="max-w-2xl mx-auto p-3">
    <form id="mainForm">
        <!-- 1. ADMIN -->
        <div class="card border-l-8 border-l-orange-500">
            <h3 class="text-xs font-black uppercase text-gray-500 mb-3 border-b">1. Datos de la Intervención</h3>
            <div class="grid grid-cols-6 gap-2">
                <div class="col-span-4"><label>Fecha</label><input type="date" id="fecha" class="persist font-bold"></div>
                <div class="col-span-2"><label>Ticket #</label><input type="text" id="ticket" class="persist"></div>
                <div class="col-span-6"><label>Nombre Sucursal</label><input type="text" id="local" list="listaNombres" class="persist uppercase font-bold text-orange-600" oninput="sincronizar('nombre')"><datalist id="listaNombres"></datalist></div>
                <div class="col-span-3"><label>Sigla Sistema</label><input type="text" id="siglaSis" list="listaSiglaSis" class="persist text-center font-bold" oninput="sincronizar('sis')"><datalist id="listaSiglaSis"></datalist></div>
                <div class="col-span-3"><label>Sigla Ticket</label><input type="text" id="siglaTic" list="listaSiglaTic" class="persist text-center font-bold" oninput="sincronizar('tic')"><datalist id="listaSiglaTic"></datalist></div>
                <div class="col-span-6 mt-2">
                    <label>Técnico Responsable</label>
                    <select id="tecnico" class="persist">
                        <option value="Fernando Soria">FERNANDO SORIA</option>
                        <option value="Tomas Vera">TOMAS VERA</option>
                        <option value="Ana Guerrero">ANA GUERRERO</option>
                    </select>
                </div>
                <div class="col-span-6 mt-2">
                    <label>Prioridad / Tipo de Servicio</label>
                    <select id="prioridad" class="persist font-bold text-blue-700">
                        <option value="">-- SELECCIONAR PRIORIDAD --</option>
                        <option value="PROGRAMADO">PROGRAMADO (PREVENTIVO)</option>
                        <option value="URGENTE">URGENTE (CORRECTIVO)</option>
                        <option value="RE-VISITA (FALLA)">RE-VISITA POR FALLA PREVIA</option>
                        <option value="RE-VISITA (REPUESTO)">RE-VISITA POR REPUESTO PENDIENTE</option>
                        <option value="GARANTIA">CARÁCTER DE GARANTÍA</option>
                    </select>
                </div>
                <div class="col-span-6 mt-2"><label>Tiempo de Labor</label><input type="text" id="labor" class="persist" placeholder="00:00 hs"></div>
            </div>
        </div>

        <!-- 2. AGUA -->
        <div class="card border-l-8 border-l-blue-500">
            <h3 class="text-xs font-black uppercase text-blue-600 mb-3 border-b">2. Calidad de Agua</h3>
            <div class="space-y-4">
                <div><label>PPM Post-Filtrado</label><input type="number" id="ppm" class="persist" oninput="evaluarJerarquia()"></div>
                <div class="grid grid-cols-3 gap-2">
                    <div><label>Filtro</label><select id="f_filtrado" class="persist" onchange="evaluarJerarquia()"><option value="OP">OP</option><option value="NO OP">NO OP</option><option value="N/A">N/A</option></select></div>
                    <div><label>Ablandador</label><select id="f_ablandador" class="persist" onchange="evaluarJerarquia()"><option value="OP">OP</option><option value="NO OP">NO OP</option><option value="N/A">N/A</option></select></div>
                    <div><label>Ósmosis</label><select id="f_osmosis" class="persist" onchange="evaluarJerarquia()"><option value="N/A">N/A</option><option value="OP">OP</option><option value="NO OP">NO OP</option></select></div>
                </div>
            </div>
        </div>

        <div class="card border-l-8 border-l-purple-500">
            <h3 class="text-xs font-black uppercase text-purple-600 mb-3 border-b">3. Observaciones Iniciales (Arribo)</h3>
            <textarea id="obsPrevias" class="persist text-xs" rows="2" placeholder="Estado previo..."></textarea>
        </div>

        <div id="equiposGrid"></div>
        <button type="button" onclick="addEquipo()" class="w-full mb-6 py-3 border-2 border-dashed border-gray-400 font-bold text-gray-400 uppercase text-xs">+ Añadir Equipo</button>

        <div class="card border-l-8 border-l-orange-400">
            <h3 class="text-xs font-black uppercase mb-2 text-orange-500 border-b">5. Registro Fotográfico</h3>
            <input type="file" id="fotoInput" accept="image/*" multiple class="text-xs mb-2">
            <div id="fotoPreview" class="grid grid-cols-4 gap-2"></div>
        </div>

        <div class="card border-l-8 border-l-green-600">
            <h3 class="text-xs font-black uppercase text-green-600 mb-3 border-b">6. Recomendaciones Finales</h3>
            <textarea id="obsFinales" class="persist text-xs" rows="3" placeholder="Sugerencias finales..."></textarea>
        </div>

        <div class="card">
            <div class="grid grid-cols-1 gap-6">
                <div class="text-center">
                    <label>Firma Técnico</label>
                    <div class="signature-box mx-auto" id="boxT"><button type="button" class="lock-btn" onclick="toggleLock('T')">🔓</button><canvas id="padT" width="350" height="150" class="w-full h-auto"></canvas></div>
                    <button type="button" onclick="clearPad('T')" class="text-[9px] underline uppercase mt-2">Limpiar Firma Téc.</button>
                </div>
                <div class="text-center border-t pt-4">
                    <label>Firma Encargado</label>
                    <div class="signature-box mx-auto" id="boxE"><button type="button" class="lock-btn" onclick="toggleLock('E')">🔓</button><canvas id="padE" width="350" height="150" class="w-full h-auto"></canvas></div>
                    <input type="text" id="nombreEncargado" class="persist text-sm uppercase text-center font-bold mt-2" placeholder="NOMBRE ENCARGADO">
                    <button type="button" onclick="clearPad('E')" class="text-[9px] underline uppercase mt-2">Limpiar Firma Enc.</button>
                </div>
            </div>
        </div>

        <button type="button" onclick="generarPDF()" class="w-full bg-[#F58220] text-white py-4 text-xl font-black uppercase rounded shadow-xl border-b-4 border-orange-800">Generar Informe V11.7</button>
    </form>
</main>

<script>
    const DB_LOCALES = [
        { n: "VILLA DEL PARQUE", s: "FVDP", t: "FVDP" }, { n: "SAN JUSTO", s: "FSJU", t: "FCSJ3" }, { n: "LAFERRERE 2", s: "FLF2", t: "FLF2" },
        { n: "RAMOS", s: "FMRAM", t: "FMRAM" }, { n: "EZEIZA", s: "FEZE", t: "FEZEA" }, { n: "CANNING", s: "FMCAN", t: "FMCAN" },
        { n: "MONTEGRANDE", s: "FMGD", t: "FMGRA" }, { n: "ZARATE", s: "FZAR", t: "FMZAR" }, { n: "GUALEGUAYCHU", s: "FMGUA", t: "FMGUA" },
        { n: "CABILDO", s: "FCAB", t: "FCABI" }, { n: "CABILDO 2", s: "FMCYM", t: "FMCYM" }, { n: "GUEMES", s: "FGUE", t: "FGUE" },
        { n: "URQUIZA", s: "FURQ", t: "FMURQ" }, { n: "PALMAS PILAR", s: "FPPI", t: "FPMPI" }, { n: "SAN ISIDRO", s: "FSIS", t: "FMSIS" },
        { n: "LA RIOJA", s: "FMRVP", t: "FMRVP" }, { n: "CATAMARCA", s: "FCAT", t: "FMCAT" }, { n: "F. ALVAREZ", s: "FFRA", t: "FFRA" },
        { n: "MORENO", s: "FMORE", t: "FMMRE" }, { n: "LUJAN", s: "FLUJ", t: "FLUJA" }, { n: "SAN MARTIN 2", s: "FMSVP", t: "FMSVP" },
        { n: "SAN MARTIN AUTO", s: "FSMA", t: "F3DF" }, { n: "SAN JUAN", s: "FSJN", t: "FSJUA" }, { n: "SAN JUAN 2", s: "FSJ2", t: "FMSJ2" },
        { n: "TUCUMAN 2", s: "FTU2", t: "FMTCM" }, { n: "TUCUMAN 3", s: "FTU3", t: "FMTM2" }, { n: "TUCUMAN 4", s: "FTU4", t: "FMTU4" },
        { n: "TUCUMAN 5", s: "FTC5", t: "FTC5" }, { n: "TUCUMAN 6", s: "FTC6", t: "FMTU6" }, { n: "TUCUMAN 7", s: "FMTU7", t: "FMTU7" },
        { n: "TUCUMAN 8", s: "FTC8", t: "FMTC8" }, { n: "PORTAL TUCUMAN", s: "MPT", t: "MPT" }, { n: "TUCUMAN 9", s: "FMTU9", t: "FMTU9" },
        { n: "QUILMES P.", s: "FQUP", t: "FMQCA" }, { n: "LA PLATA 2", s: "FLP2", t: "FLPCA" }, { n: "LA PLATA 3", s: "FLP3", t: "FLPC3" },
        { n: "LA PLATA 4", s: "FLP4", t: "FLPC4" }, { n: "LA PLATA 6", s: "FLP6", t: "FLPC6" }, { n: "CITY BELL", s: "FCYB", t: "FMCB1" },
        { n: "REPUBLICA", s: "FRDN", t: "FRPNI" }, { n: "S DEL ESTERO", s: "FSDE", t: "FSANT" }, { n: "MENDOZA CENTRO", s: "FMMSM", t: "FMMSM" },
        { n: "MENDOZA COLON", s: "FMMCO", t: "FMMCO" }, { n: "SAN RAFAEL", s: "FSRM", t: "FSRM" }, { n: "GONNET", s: "FGON", t: "FGONN" },
        { n: "BERAZATEGUI", s: "FBER", t: "FMBER" }, { n: "ROTONDA", s: "FMRG", t: "FROG" }, { n: "LOMAS AUTO", s: "FLOZ", t: "FMLOA" },
        { n: "LOMAS", s: "FMLCA", t: "FMLCA" }, { n: "WILDE", s: "FMWVP", t: "FMWVP" }, { n: "BARILOCHE", s: "FBA1", t: "FMBRC" },
        { n: "USHUAIA", s: "FUSH", t: "FUSHA" }, { n: "RIO GRANDE", s: "FRGD", t: "FRGRD" }, { n: "PORTAL SALTA", s: "FPSA", t: "FTART" },
        { n: "SALTA LIBERTAD", s: "FSLI", t: "FSLIB" }, { n: "SALTA PEATONAL", s: "FSVP", t: "FSAL4" }, { n: "SALTA AUTO", s: "FSAA", t: "FMSAA" },
        { n: "SALTA NOA", s: "MSN", t: "MSN" }, { n: "JUJUY", s: "FJUJ", t: "FJUJY" }, { n: "SALTA ORAN", s: "FSAO", t: "FSAO" },
        { n: "PARQUE CHAC", s: "FPCH", t: "FMPCH" }, { n: "CONSTITUCION", s: "FMCNT", t: "FMCNT" }, { n: "SPINETTO", s: "FSPI", t: "FSPIN" },
        { n: "LANUS 2", s: "FLA2", t: "FMLAC" }, { n: "CARRE QUILMES", s: "FCQU", t: "FCFQU" }, { n: "LA PAMPA", s: "FLPA", t: "FROSA" },
        { n: "FORMOSA", s: "FMFOR", t: "FMFOR" }, { n: "FLORES", s: "FFLO", t: "FFLOR" }, { n: "PRIMERA JUNTA", s: "FMPRI", t: "FMPRI" },
        { n: "LINIERS", s: "FLIN", t: "FLINR" }, { n: "ONCE", s: "FMONC", t: "FMONC" }, { n: "TERRADA", s: "-", t: "-" },
        { n: "BOLIVAR", s: "FBOL", t: "FMBLV" }, { n: "JUNIN", s: "FMJUN", t: "FMJUN" }, { n: "RIO GALLEGOS", s: "FRGA", t: "-" },
        { n: "POMPEYA", s: "FMPYA", t: "FMPYA" }, { n: "GALLEGOS", s: "FMP1", t: "FMDQG" }, { n: "ALDREY", s: "FMP2", t: "FMDQ2" },
        { n: "LA PERLA", s: "FMD3", t: "FMP3" }, { n: "PEATONAL", s: "FMDQ4", t: "FMDQ4" }, { n: "OLAVARRIA", s: "FOLAV", t: "FOLAV" },
        { n: "TANDIL", s: "FCTA", t: "FTAND" }, { n: "SAN FERNANDO", s: "FSAF", t: "FSAF" }, { n: "GRAND BOURG", s: "FGBG", t: "FGRBG" },
        { n: "JOSE C PAZ", s: "FJCP", t: "FMJCP" }, { n: "SAN MIGUEL 3", s: "FSM2", t: "FMSM3" }, { n: "SAN MIGUEL A.", s: "FMSMA", t: "FMSMA" },
        { n: "MERLO", s: "FMER", t: "FMERL" }, { n: "CORRIENTES", s: "FCOR", t: "FMCOR" }, { n: "RESISTENCIA", s: "FMRES", t: "FMRES" },
        { n: "SAN LUIS", s: "FSLS", t: "FMSLI" }, { n: "BOEDO", s: "FBOE", t: "FMBOE" }, { n: "SAN TELMO", s: "FSTM", t: "FMSTO" },
        { n: "AV DE MAYO", s: "FAVM", t: "FAMAY" }, { n: "AV DE MAYO 2", s: "FAVM2", t: "FAMA2" }, { n: "9 DE JULIO", s: "F9DJ", t: "FM9JU" },
        { n: "CALLAO", s: "FMCYC", t: "FMCYC" }, { n: "RAFAELA", s: "FRAF", t: "FRAFA" }, { n: "RIBERA SANTA FE", s: "FRSF", t: "FSFER" },
        { n: "WALMART STA FE", s: "FWSF", t: "FSFEW" }, { n: "SANTA FE P.", s: "FMSFV", t: "FMSFV" }, { n: "PORTAL ROSARIO", s: "FPRO", t: "FPROS" },
        { n: "PELLEGRINI", s: "FPEL", t: "FMROS" }, { n: "ROSARIO SUR", s: "FRSM", t: "FRSM" }, { n: "OROÑO", s: "FROA", t: "FORO" },
        { n: "SAN NICOLAS", s: "FMSNI", t: "FMSNI" }, { n: "PUMA", s: "FMPUM", t: "FMPUM" }, { n: "FUNES", s: "FMPUM", t: "FMFUN" },
        { n: "ALTO ROSARIO", s: "MAR", t: "MAR" }, { n: "CITY CENTER", s: "MCR", t: "MCR" }
    ];

    let padT, padE, processedImages = [], locks = { T: false, E: false }, waterColor = "VERDE";
    const TAREAS = ["Limpieza grupo", "Cambio juntas", "Calibración", "Descalcificación"];

    window.onload = () => {
        padT = new SignaturePad(document.getElementById('padT'));
        padE = new SignaturePad(document.getElementById('padE'));
        initDatalists(); loadDraft();
        if(document.querySelectorAll('.equipo-item').length === 0) addEquipo();
        evaluarJerarquia();
        document.querySelectorAll('.persist').forEach(el => el.addEventListener('input', saveDraft));
    };

    function initDatalists() {
        const nL = document.getElementById('listaNombres'), sL = document.getElementById('listaSiglaSis'), tL = document.getElementById('listaSiglaTic');
        DB_LOCALES.forEach(l => { if(l.n!=="-") nL.innerHTML += `<option value="${l.n}">`; if(l.s!=="-") sL.innerHTML += `<option value="${l.s}">`; if(l.t!=="-") tL.innerHTML += `<option value="${l.t}">`; });
    }

    function sincronizar(o) {
        const nI = document.getElementById('local'), sI = document.getElementById('siglaSis'), tI = document.getElementById('siglaTic');
        let enc = DB_LOCALES.find(l=> (o==='nombre' && l.n===nI.value.toUpperCase()) || (o==='sis' && l.s===sI.value.toUpperCase()) || (o==='tic' && l.t===tI.value.toUpperCase()));
        if(enc) { nI.value = enc.n; sI.value = enc.s; tI.value = enc.t; }
        saveDraft();
    }

    function toggleLock(t) {
        locks[t] = !locks[t]; const pad = t === 'T' ? padT : padE;
        const box = document.getElementById(`box${t}`), btn = box.querySelector('.lock-btn');
        if(locks[t]) { pad.off(); btn.innerText = "🔒"; box.classList.add('locked'); }
        else { pad.on(); btn.innerText = "🔓"; box.classList.remove('locked'); }
    }

    function clearPad(t) { if(!locks[t]) (t === 'T' ? padT : padE).clear(); }

    function evaluarJerarquia() {
        const ppm = parseInt(document.getElementById('ppm').value) || 0;
        const fallasAgua = [document.getElementById('f_filtrado').value, document.getElementById('f_ablandador').value, document.getElementById('f_osmosis').value].filter(v => v === 'NO OP').length;
        waterColor = (ppm > 200 || fallasAgua >= 2) ? "ROJO" : (ppm > 150 || fallasAgua === 1 ? "AMARILLO" : "VERDE");
        let mS = 0; document.querySelectorAll('.eq-est').forEach(s => { if(s.value==="FUERA DE SERVICIO") mS=2; else if(s.value==="OPERATIVA CON OBS." && mS<2) mS=1; });
        document.getElementById('statusLed').className = `h-5 w-5 rounded-full ${waterColor==='ROJO'||mS===2?'bg-red-600 animate-pulse':'bg-green-500'}`;
        saveDraft();
    }

    function addEquipo(v = null) {
        const div = document.createElement('div'); div.className = "card equipo-item border-l-8 border-l-orange-500";
        div.innerHTML = `
            <div class="flex flex-wrap justify-between items-center mb-3 gap-2">
                <select class="persist-dyn eq-mod font-bold text-orange-600 w-full sm:w-1/2 border-none p-0 bg-transparent">
                    <option value="Cimbali" ${v?.mod==='Cimbali'?'selected':''}>CIMBALI</option><option value="Melitta" ${v?.mod==='Melitta'?'selected':''}>MELITTA</option><option value="Otros" ${v?.mod==='Otros'?'selected':''}>OTROS</option>
                </select>
                <div class="flex gap-2 w-full sm:w-auto">
                    <div class="flex flex-col"><label class="text-[7px]">S/N</label><input type="text" class="persist-dyn eq-sn text-xs text-right border-none" value="${v?.sn||''}"></div>
                    <div class="flex flex-col"><label class="text-[7px]">Ciclos</label><input type="number" class="persist-dyn eq-shots text-xs text-right border-none font-black text-blue-600" value="${v?.shots||''}"></div>
                    <button type="button" onclick="this.closest('.equipo-item').remove(); evaluarJerarquia();" class="ml-2 text-red-500 font-bold">&times;</button>
                </div>
            </div>
            <textarea placeholder="DIAGNÓSTICO..." class="persist-dyn eq-diag text-xs mb-2" rows="2">${v?.diag||''}</textarea>
            <textarea placeholder="TRABAJOS REALIZADOS..." class="persist-dyn eq-det text-xs mb-2" rows="2">${v?.det||''}</textarea>
            <div class="flex flex-wrap gap-1 mb-2">${TAREAS.map(t=>`<span class="tag-btn text-[9px]" onclick="addTask(this,'${t}')">${t}</span>`).join('')}</div>
            <div class="card bg-gray-50 border-none p-2 mt-2">
                <div class="grid grid-cols-2 gap-2">
                    <div><label class="text-[7px]">Lancetas</label><select class="persist-dyn h-lanc text-[10px] font-bold"><option value="OP" ${v?.hL==='OP'?'selected':''}>OP</option><option value="SUCIO" ${v?.hL==='SUCIO'?'selected':''}>SUCIO</option></select></div>
                    <div><label class="text-[7px]">Tolvas</label><select class="persist-dyn h-tolv text-[10px] font-bold"><option value="OP" ${v?.hT==='OP'?'selected':''}>OP</option><option value="SUCIO" ${v?.hT==='SUCIO'?'selected':''}>SUCIO</option></select></div>
                </div>
            </div>
            <div class="card bg-blue-50 border-none p-2 mt-2">
                <div class="grid grid-cols-3 gap-2">
                    <div><label class="text-[7px]">Pastillas</label><select class="persist-dyn s-past text-[10px] font-bold"><option value="STOCK" ${v?.sP==='STOCK'?'selected':''}>OK</option><option value="CRÍTICO" ${v?.sP==='CRÍTICO'?'selected':''}>FALTA</option></select></div>
                    <div><label class="text-[7px]">Sal</label><select class="persist-dyn s-sal text-[10px] font-bold"><option value="STOCK" ${v?.sS==='STOCK'?'selected':''}>OK</option><option value="CRÍTICO" ${v?.sS==='CRÍTICO'?'selected':''}>FALTA</option></select></div>
                    <div><label class="text-[7px]">Ósmosis</label><select class="persist-dyn s-liq text-[10px] font-bold"><option value="STOCK" ${v?.sL==='STOCK'?'selected':''}>OK</option><option value="CRÍTICO" ${v?.sL==='CRÍTICO'?'selected':''}>FALTA</option></select></div>
                </div>
            </div>
            <div class="space-y-2 border-t pt-2 mt-2">
                <input type="text" placeholder="PEDIDO REPUESTOS" class="persist-dyn eq-rep-n text-[10px]" value="${v?.repN||''}">
                <select class="persist-dyn eq-est font-bold text-xs" onchange="evaluarJerarquia()">
                    <option value="OPERATIVA" ${v?.est==='OPERATIVA'?'selected':''}>OPERATIVA</option><option value="OPERATIVA CON OBS." ${v?.est==='OPERATIVA CON OBS.'?'selected':''}>OPERATIVA CON OBS.</option><option value="FUERA DE SERVICIO" ${v?.est==='FUERA DE SERVICIO'?'selected':''}>FUERA DE SERVICIO</option>
                </select>
            </div>`;
        document.getElementById('equiposGrid').appendChild(div);
        div.querySelectorAll('.persist-dyn').forEach(el => el.addEventListener('input', saveDraft));
    }

    function addTask(b, t) { const a = b.closest('.equipo-item').querySelectorAll('textarea')[1]; a.value += (a.value ? ', ' : '') + t; saveDraft(); }

    document.getElementById('fotoInput').onchange = async (e) => {
        const files = Array.from(e.target.files).slice(0, 4); processedImages = [];
        const prev = document.getElementById('fotoPreview'); prev.innerHTML = "<p class='col-span-4 text-[8px] animate-pulse'>Procesando...</p>";
        for (const f of files) {
            const data = await new Promise(res => {
                const r = new FileReader(); r.onload = (ev) => {
                    const img = new Image(); img.onload = () => {
                        const c = document.createElement('canvas'); const s = 800/img.width; c.width = 800; c.height = img.height*s;
                        c.getContext('2d').drawImage(img, 0,0,800,c.height); res(c.toDataURL('image/jpeg', 0.7));
                    }; img.src = ev.target.result;
                }; r.readAsDataURL(f);
            });
            processedImages.push(data);
        }
        prev.innerHTML = ''; processedImages.forEach(img => { const d = document.createElement('div'); d.className = "h-12 border-2 border-orange-500 rounded bg-cover bg-center"; d.style.backgroundImage = `url(${img})`; prev.appendChild(d); });
    };

    function saveDraft() {
        const d = {
            c: { fe: document.getElementById('fecha').value, l: document.getElementById('local').value, ss: document.getElementById('siglaSis').value, st: document.getElementById('siglaTic').value, t: document.getElementById('ticket').value, tec: document.getElementById('tecnico').value, pr: document.getElementById('prioridad').value, p: document.getElementById('ppm').value, f: document.getElementById('f_filtrado').value, a: document.getElementById('f_ablandador').value, o: document.getElementById('f_osmosis').value, lab: document.getElementById('labor').value, op: document.getElementById('obsPrevias').value, of: document.getElementById('obsFinales').value, enc: document.getElementById('nombreEncargado').value },
            e: Array.from(document.querySelectorAll('.equipo-item')).map(eq => ({ mod: eq.querySelector('.eq-mod').value, sn: eq.querySelector('.eq-sn').value, shots: eq.querySelector('.eq-shots').value, diag: eq.querySelector('.eq-diag').value, det: eq.querySelector('.eq-det').value, hL: eq.querySelector('.h-lanc').value, hT: eq.querySelector('.h-tolv').value, sP: eq.querySelector('.s-past').value, sL: eq.querySelector('.s-liq').value, sS: eq.querySelector('.s-sal').value, repN: eq.querySelector('.eq-rep-n').value, est: eq.querySelector('.eq-est').value }))
        };
        localStorage.setItem('mostaza_elite_v11_6', JSON.stringify(d));
    }

    function loadDraft() {
        const r = localStorage.getItem('mostaza_elite_v11_6'); if (!r) return;
        const d = JSON.parse(r); document.getElementById('fecha').value = d.c.fe||''; document.getElementById('local').value = d.c.l||''; document.getElementById('siglaSis').value = d.c.ss||'';
        document.getElementById('siglaTic').value = d.c.st||''; document.getElementById('ticket').value = d.c.t||''; document.getElementById('tecnico').value = d.c.tec||'';
        document.getElementById('ppm').value = d.c.p||''; document.getElementById('prioridad').value = d.c.pr || ''; document.getElementById('labor').value = d.c.lab||''; document.getElementById('obsPrevias').value = d.c.op||''; document.getElementById('obsFinales').value = d.c.of||''; document.getElementById('nombreEncargado').value = d.c.enc||'';
        if (d.e) { document.getElementById('equiposGrid').innerHTML = ''; d.e.forEach(eq => addEquipo(eq)); }
    }

    function getSemCol(s) { return s === "ROJO" ? [200, 0, 0] : (s === "AMARILLO" ? [255, 191, 0] : [0, 150, 0]); }

    function generarPDF() {
        try {
            const { jsPDF } = window.jspdf; const doc = new jsPDF();
            let curY = 20;

            // --- HEADER CORPORATIVO V11.6 ---
            doc.setFillColor(200, 0, 0); doc.circle(105, 12, 7, 'F');
            doc.setTextColor(255); doc.setFontSize(14); doc.setFont("helvetica", "bold"); doc.text("M", 105, 14, {align:'center'});
            doc.setFontSize(10); doc.setTextColor(0); doc.text("MOSTAZA MANTENIMIENTO FRANQUICIAS", 105, 23, {align:'center'});
            doc.setFontSize(12); doc.text("INFORME TÉCNICO", 15, 15);
            doc.setFontSize(9); doc.setFont("helvetica", "normal"); doc.text(document.getElementById('fecha').value || 'S/D', 185, 15, {align:'right'});
            curY += 10;

            // 1. Datos Intervención
            doc.setDrawColor(200); doc.rect(15, curY, 180, 25);
            doc.setFont("helvetica", "bold"); doc.text("1. Datos de la Intervención", 17, curY+5);
            doc.setFont("helvetica", "normal");
            doc.text(`Local: ${document.getElementById('local').value} (${document.getElementById('siglaTic').value})`, 20, curY+12);
            doc.text(`Técnico: ${document.getElementById('tecnico').value}`, 20, curY+18);
            doc.text(`Ticket N°: ${document.getElementById('ticket').value}`, 110, curY+12);
            doc.setFont("helvetica", "bold"); doc.text(`PRIORIDAD: ${document.getElementById('prioridad').value}`, 110, curY+18);
            curY += 32;

            // 2. Calidad Agua (LED ONLY)
            doc.setFillColor(245); doc.rect(15, curY, 180, 12, 'F');
            doc.setTextColor(0); doc.setFontSize(10); doc.setFont("helvetica", "bold"); doc.text("2. CALIDAD DE AGUA:", 20, curY+8);
            const cA = getSemCol(waterColor); doc.setFillColor(cA[0],cA[1],cA[2]); doc.circle(65, curY+7, 3, 'F');
            doc.setTextColor(0); doc.setFontSize(8); doc.setFont("helvetica", "normal");
            doc.text(`PPM: ${document.getElementById('ppm').value} | FIL: ${document.getElementById('f_filtrado').value} | AB: ${document.getElementById('f_ablandador').value}`, 85, curY+8);
            curY += 18;

            // 3. Obs Iniciales
            doc.setFontSize(9); doc.setFont("helvetica", "bold"); doc.text("3. Observaciones Iniciales:", 15, curY);
            doc.setFontSize(8); doc.setFont("helvetica", "normal");
            const pL = doc.splitTextToSize(document.getElementById('obsPrevias').value || "Sin observaciones.", 180);
            doc.text(pL, 15, curY+5); curY += (pL.length * 4) + 10;

            // 4. Equipos (Con LED por Activo)
            document.querySelectorAll('.equipo-item').forEach((eq, i) => {
                if(curY > 230) { doc.addPage(); curY = 20; }
                doc.setFillColor(235); doc.rect(15, curY, 180, 7, 'F');
                doc.setFontSize(9); doc.setFont("helvetica", "bold"); 
                doc.text(`4.${i+1} EQUIPO: ${eq.querySelector('.eq-mod').value} (SN: ${eq.querySelector('.eq-sn').value}) | CICLOS: ${eq.querySelector('.eq-shots').value || '0'}`, 17, curY+5);
                curY += 12;
                
                const status = eq.querySelector('.eq-est').value;
                let sCol = getSemCol(status.includes("FUERA") ? "ROJO" : (status.includes("OBS") ? "AMARILLO" : "VERDE"));
                doc.setFont("helvetica", "bold"); doc.text("Detalle:", 15, curY);
                doc.setFont("helvetica", "normal"); doc.text("Estado Final:", 110, curY);
                doc.setFillColor(sCol[0], sCol[1], sCol[2]); doc.circle(135, curY-1, 2.5, 'F'); 
                curY += 5;

                const dL = doc.splitTextToSize("Diag: " + eq.querySelector('.eq-diag').value, 175); doc.text(dL, 15, curY); curY += (dL.length * 4) + 2;
                const wL = doc.splitTextToSize("Trabajo: " + eq.querySelector('.eq-det').value, 175); doc.text(wL, 15, curY); curY += (wL.length * 4) + 5;
                doc.setFontSize(8); doc.setFont("helvetica", "bold");
                doc.text(`Pedido Repuestos: ${eq.querySelector('.eq-rep-n').value || 'Ninguno'}`, 15, curY); curY += 10;
            });

            // 5. Fotos y Recomendaciones
            if(processedImages.length > 0) {
                if(curY > 150) { doc.addPage(); curY = 20; }
                doc.setFont("helvetica", "bold"); doc.text("5. Registro Fotográfico", 15, curY); curY += 10;
                processedImages.forEach((img, i) => {
                    const x = 15 + (i % 2 * 95); const y = curY + (Math.floor(i / 2) * 75);
                    doc.addImage(img, 'JPEG', x, y, 90, 65);
                });
                curY += (Math.ceil(processedImages.length / 2) * 75) + 5;
            }

            if(curY > 240) { doc.addPage(); curY = 20; }
            doc.setFontSize(9); doc.setFont("helvetica", "bold"); doc.text("6. Recomendaciones Finales:", 15, curY);
            const fL = doc.splitTextToSize(document.getElementById('obsFinales').value || "Sin recomendaciones.", 180);
            doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.text(fL, 15, curY+5); curY += (fL.length * 4) + 15;

            // 7. Firmas (Hardened)
            if(curY > 220) { doc.addPage(); curY = 20; }
            doc.line(15, curY, 195, curY); curY += 10;
            doc.addImage(padT.toDataURL(),'PNG', 15, curY, 60, 30); doc.addImage(padE.toDataURL(),'PNG', 120, curY, 60, 30);
            doc.setFontSize(8); doc.setFont("helvetica", "bold");
            doc.text("FIRMA TÉCNICO", 15, curY+35); doc.text(`ENCARGADO: ${document.getElementById('nombreEncargado').value || 'CONFORMIDAD'}`, 120, curY+35);

            // --- PÁGINA 2: RESUMEN GERENCIA (LED ONLY) ---
            doc.addPage(); let resY = 15;
            doc.setFillColor(200, 0, 0); doc.circle(105, 12, 7, 'F');
            doc.setTextColor(255); doc.setFontSize(14); doc.text("M", 105, 14, {align:'center'});
            doc.setTextColor(0); doc.setFontSize(10); doc.text("MOSTAZA MANTENIMIENTO FRANQUICIAS", 105, 23, {align:'center'});
            doc.setFillColor(245, 130, 32); doc.rect(15, 28, 180, 10, 'F');
            doc.setTextColor(255); doc.setFontSize(12); doc.text("RESUMEN DE ESTADO PARA GERENCIA", 105, 34.5, {align:'center'});
            
            doc.setTextColor(0); doc.setFontSize(10); resY = 50;
            doc.setFont("helvetica", "bold"); doc.text("DATOS DE CONTROL:", 15, resY); doc.setFont("helvetica", "normal");
            doc.text(`LOCAL: ${document.getElementById('local').value}`, 15, resY + 7);
            doc.text(`TICKET: ${document.getElementById('ticket').value} | FECHA: ${document.getElementById('fecha').value}`, 110, resY + 7);
            resY += 20;

            doc.setFont("helvetica", "bold"); doc.text("ESTADO DE SALUD HÍDRICA:", 15, resY); doc.setFont("helvetica", "normal");
            doc.text("AGUA:", 15, resY + 7); 
            doc.setFillColor(cA[0], cA[1], cA[2]); doc.circle(32, resY + 6, 3, 'F');
            doc.text(`LECTURA: ${document.getElementById('ppm').value} PPM`, 45, resY + 7); resY += 20;
            
            doc.setFont("helvetica", "bold"); doc.text("ACCIONES Y ESTADO POR EQUIPO:", 15, resY); resY += 10;
            document.querySelectorAll('.equipo-item').forEach(eq => {
                const s = eq.querySelector('.eq-est').value;
                let c = getSemCol(s.includes("FUERA") ? "ROJO" : (s.includes("OBS") ? "AMARILLO" : "VERDE"));
                doc.setFillColor(c[0], c[1], c[2]); doc.circle(18, resY - 1, 2, 'F');
                doc.setFont("helvetica", "bold"); doc.text(`${eq.querySelector('.eq-mod').value} (SN: ${eq.querySelector('.eq-sn').value}):`, 25, resY);
                resY += 5; doc.setFont("helvetica", "normal"); doc.setFontSize(9);
                doc.text(`-> PEDIDO: ${eq.querySelector('.eq-rep-n').value || 'Sin pedidos'}`, 25, resY);
                resY += 8; doc.setFontSize(10);
            });

            for(let i = 1; i <= doc.internal.getNumberOfPages(); i++) { doc.setPage(i); doc.setFontSize(7); doc.setTextColor(150); doc.text("Mostaza Mantenimiento Franquicias - Control Interno Regional", 105, 290, {align:'center'}); }

            doc.save(`Elite_${document.getElementById('siglaTic').value || 'Rep'}_${document.getElementById('fecha').value}.pdf`);
        } catch (e) { alert("Error PDF: " + e.message); }
    }

    function resetAll() { if(confirm("¿BORRAR?")) { localStorage.clear(); location.reload(); } }
</script>
